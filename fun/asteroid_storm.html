  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "Asteroid Storm",
  "description": "A free pixel-art arcade game: steer through an ever-thickening asteroid storm, dodge comets and black holes, and see how long you survive.",
  "url": "https://panphy.app/fun/asteroid_storm.html",
  "applicationCategory": "GameApplication",
  "operatingSystem": "Any",
  "browserRequirements": "Requires HTML5 and JavaScript",
  "isAccessibleForFree": true,
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  },
  "author": {
    "@type": "Organization",
    "name": "PanPhy Labs",
    "url": "https://panphy.app/"
  },
  "publisher": {
    "@type": "Organization",
    "name": "PanPhy Labs",

  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/assets/standalone-top.css">
  <link rel="stylesheet" href="asteroid_storm/style.css?v=20261123-joystick">
  <script type="module" src="asteroid_storm/main.js?v=20261123-joystick"></script>
</head>

<body>
  <header class="topbar">
    <a class="home" href="https://panphy.app/">
      <img src="/assets/panphy.png" alt="PanPhy Labs home" width="32" height="32">
    </a>
    <h1 class="title"><canvas id="titleArt" class="title-art" width="262" height="30" role="img" aria-label="Asteroid Storm"></canvas></h1>
  </header>

  <main class="layout">
    <section class="cabinet" aria-label="Game">
      <div class="screen">
        <canvas id="game" width="360" height="240" tabindex="0"
          aria-label="Asteroid Storm game. Drag or use the arrow keys to move the ship; press Enter to start."></canvas>
      </div>
      <div class="controls">
        <button type="button" class="pixel-button" id="pauseButton" aria-pressed="false" title="Pause (P)">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 8 8" shape-rendering="crispEdges"><path d="M1 1h2v6H1zM5 1h2v6H5z"/></svg>
          </span>
          <span class="label">Pause</span>
        </button>
        <canvas id="joystick" class="joystick" width="48" height="48" aria-hidden="true"></canvas>
        <button type="button" class="pixel-button" id="soundButton" aria-pressed="true" title="Sound (M)">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 8 8" shape-rendering="crispEdges"><path d="M0 3h2v2H0zM2 2h1v4H2zM3 1h1v6H3zM5 2h1v1H5zM5 5h1v1H5zM6 3h1v2H6z"/></svg>
          </span>
          <span class="label">Sound on</span>
        </button>
      </div>
    </section>

    <aside class="board" aria-labelledby="boardTitle">
      <h2 id="boardTitle">Top Survivors</h2>
      <ol id="scoreList" class="scores"></ol>
      <p id="boardStatus" class="board-status" role="status" hidden></p>
    </aside>

    <section class="board trophies" aria-labelledby="trophyTitle">
      <h2 id="trophyTitle">Trophies <span id="trophyCount" class="trophy-count">0 / 16</span></h2>
      <div id="trophyGrid" class="trophy-grid"></div>
      <div id="trophyDetail" class="trophy-detail" aria-live="polite">
        <p class="trophy-goal">Tap a trophy to see how to earn it.</p>
      </div>
      <button type="button" class="pixel-button ghost clear-records" id="clearRecords">Clear local records</button>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; PanPhy Labs. All rights reserved.</p>
    <p><a href="https://buymeacoffee.com/panphy" target="_blank" rel="noopener noreferrer">Support My Projects</a></p>
  </footer>

  <dialog id="initialsModal" class="dialog" aria-labelledby="dialogTitle">
    <form id="initialsForm" method="dialog">
      <h2 id="dialogTitle">Top ten!</h2>
      <p id="modalScore" class="dialog-score">0.00 s</p>
      <label for="initialsInput">Your initials</label>
      <input id="initialsInput" type="text" maxlength="3" autocomplete="off" autocapitalize="characters"
        spellcheck="false" inputmode="text" placeholder="AAA" required>
      <p id="initialsError" class="dialog-error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" class="pixel-button ghost" id="skipInitials">Skip</button>
        <button type="submit" class="pixel-button primary" id="submitInitials">Submit</button>
      </div>
    </form>
  </dialog>
</body>

</html>
