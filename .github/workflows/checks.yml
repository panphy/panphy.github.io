name: Checks

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # every Monday: all tests and pages, to catch anything a narrower run missed

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the BUILD_ID check and the choice of tests compare with the base branch
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Repository checks
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            node .github/scripts/check.mjs --base "origin/$BASE_REF"
          else
            node .github/scripts/check.mjs
          fi
      # Pull requests run only the tests and pages their changes can affect; other runs check everything.
      - name: Choose tests and pages
        id: pick
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            node .github/scripts/affected.mjs --base "origin/$BASE_REF"
          else
            node .github/scripts/affected.mjs --all
          fi
      - name: App tests
        if: steps.pick.outputs.tests != ''
        env:
          TESTS: ${{ steps.pick.outputs.tests }}
        run: node --test $TESTS
      - name: Accessibility smoke check
        if: steps.pick.outputs.a11y != 'none'
        env:
          PAGES: ${{ steps.pick.outputs.pages }}
        run: node .github/scripts/a11y-smoke.mjs $PAGES
