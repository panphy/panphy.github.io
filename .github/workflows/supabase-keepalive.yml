name: Supabase keep-alive

on:
  schedule:
    - cron: '0 3 * * 1,4' # Mon & Thu 03:00 UTC; max gap 4 days, pause threshold is 7
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query SpellWave leaderboard
        env:
          # anon key is already public in fun/spellwave/src/main.js
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxka2dvZHhhbHd1dmtxeWdjaG5zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3NzEyNTgsImV4cCI6MjA4NTM0NzI1OH0.PZ3rbRZCfwzniQgq5RiZ9cikPNvdYwr9uGYNwN6xQKY
        run: |
          curl -sf "https://ldkgodxalwuvkqygchns.supabase.co/rest/v1/spellwave_leaderboard?select=initials&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
