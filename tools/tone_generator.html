<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F5F6FA">
  <script src="/assets/theme.js" data-legacy-dark="tone-generator-dark" data-legacy-light="tone-generator-light"></script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="/assets/standalone-top.css">
  <title>Two-Channel Tone Generator (Sine Wave) — PanPhy Labs</title>
  <meta name="description" content="A free online tone generator: mix two sine-wave channels with precise frequency and level controls, for sound and wave experiments.">
  <link rel="canonical" href="https://panphy.app/tools/tone_generator.html">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <script src="/assets/sw-register.js" defer></script>
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <link rel="stylesheet" href="/assets/design.css">
  <style>
    /* Tone Generator: an app bar, the combined output with master controls on the
       left, and up to two channel cards on the right. On laptop screens and larger
       everything fits the window without scrolling; narrow screens stack and scroll. */

    /* Colors and fonts come from the shared design system (/assets/design.css);
       these names keep the rest of this stylesheet unchanged. Channel and
       combined line colors carry meaning and stay as they were. */
    :root {
      --font-sans: var(--font-body);
      --bg-color: var(--bg);
      --surface-alt: var(--surface-2);
      --text-main: var(--ink);
      --text-secondary: var(--ink-2);
      --text-muted: var(--ink-3);
      --border: var(--line);
      --border-strong: var(--line-strong);
      --brand-primary: var(--accent);
      --brand-accent: var(--accent);
      --warm-soft: var(--accent-soft);
      --grid-minor: rgba(28, 40, 90, .035);
      --grid-major: rgba(28, 40, 90, .075);
      --shadow: var(--shadow-1);
      --canvas-bg: var(--surface);
      --axis-line: var(--line);
      --ch1-line: #2F6FA8;
      --ch2-line: #8E4FA0;
      --combined-line: #C2410C;
      --hit: 44px;
    }

    [data-theme="dark"] {
      --grid-minor: rgba(150, 175, 255, .03);
      --grid-major: rgba(150, 175, 255, .065);
      --ch1-line: #7CB5EC;
      --ch2-line: #D4A6E0;
      --combined-line: #FB923C;
    }

    @media (pointer: coarse) {
      :root { --hit: 48px; }
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      color: var(--text-main);
      background-color: var(--bg-color);
      background-image: linear-gradient(var(--grid-major) 1px, transparent 1px), linear-gradient(90deg, var(--grid-major) 1px, transparent 1px), linear-gradient(var(--grid-minor) 1px, transparent 1px), linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px);
      background-size: 30px 30px, 30px 30px, 6px 6px, 6px 6px;
    }
    a { color: var(--brand-primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button, input, select, output { font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--brand-accent); outline-offset: 2px; }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    /* ---------- Shell ---------- */
    #app { display: flex; flex-direction: column; height: 100dvh; min-height: 600px; }

    .audio-appbar {
      flex: none;
      display: flex; align-items: center; gap: 12px; min-height: 56px;
      padding: 6px 20px; padding-top: calc(6px + var(--standalone-top, 0px));
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .audio-brand { display: flex; align-items: center; gap: 10px; color: var(--text-main); }
    .audio-brand > a { display: inline-flex; }
    .audio-brand img { width: 32px; height: 32px; object-fit: contain; }
    .audio-brand h1 { margin: 0; font: 600 1.02rem var(--font-display); letter-spacing: -.03em; }
    .audio-appbar { position: relative; }
    /* One thin spectrum line under the app bar marks the app as PanPhy. */
    .audio-appbar::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--spectrum); opacity: .85; pointer-events: none; }
    .banner-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .banner-actions button { min-height: var(--hit); }

    #workspace {
      flex: 1; min-height: 0; width: 100%; max-width: 1920px; margin: 0 auto;
      padding: 12px;
      display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(400px, 1fr);
      gap: 12px;
    }

    .panel {
      min-width: 0; min-height: 0;
      display: flex; flex-direction: column; gap: 10px;
      padding: 12px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
    }

    .audio-statusbar {
      flex: none;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
      gap: 6px 16px; min-height: 30px;
      padding: 4px 14px calc(4px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--border); background: var(--surface-alt);
      font-size: .76rem; line-height: 1.5; color: var(--text-muted);
      -webkit-font-smoothing: antialiased;
    }
    .audio-statusbar a { color: var(--text-secondary); }
    #transportHint { font-family: var(--font-mono); }
    .audio-statusbar-legal { margin-left: auto; white-space: nowrap; }

    /* ---------- Buttons ---------- */
    .button-icon {
      width: 18px; height: 18px; flex: 0 0 18px;
      fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
      pointer-events: none;
    }
    .button-icon .fill { fill: currentColor; stroke: none; }

    .tool {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      min-width: var(--hit); min-height: var(--hit); padding: 0 12px;
      font-size: .86rem; font-weight: 600; color: var(--text-main);
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
      transition: background-color .15s ease, border-color .15s ease, color .15s ease;
    }
    .tool:hover:not(:disabled) { background: var(--surface-3); border-color: var(--border-strong); }
    .tool:active:not(:disabled) { background: var(--border); }
    .tool:disabled { cursor: not-allowed; opacity: .5; }
    .tool-icon { padding: 0; width: var(--hit); }
    .tool-danger { color: var(--text-secondary); }
    .tool-danger:hover:not(:disabled) { color: var(--danger); background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 30%, transparent); }

    .play-main {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: var(--hit); min-width: 112px; padding: 0 18px;
      font-size: .92rem; font-weight: 700;
      color: var(--accent-ink); background: var(--brand-accent);
      border: 1px solid transparent; border-radius: 999px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .12);
      transition: background-color .15s ease;
    }
    .play-main:hover:not(:disabled) { background: var(--accent-hover); }
    .play-main:disabled { cursor: not-allowed; opacity: .5; }
    .play-main.is-playing { color: var(--text-main); background: var(--surface-3); border-color: var(--border-strong); box-shadow: none; }
    .play-main.is-playing:hover { background: var(--border); }

    /* Status pill with a dot. */
    .state-chip {
      display: inline-flex; align-items: center; gap: 6px;
      min-height: 24px; padding: 0 9px; border-radius: 999px;
      font-size: .72rem; font-weight: 700; letter-spacing: .02em; white-space: nowrap;
      color: var(--text-secondary); background: var(--surface-3);
      user-select: none;
    }
    .state-chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .7; }
    .state-chip.playing { color: var(--brand-accent); background: var(--accent-soft); }
    .state-chip.playing::before { opacity: 1; box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand-accent) 25%, transparent); }
    .state-chip.ready { color: var(--brand-primary); background: var(--warm-soft); }

    /* Segmented switch (radio group). */
    .seg {
      display: inline-flex; padding: 3px; gap: 2px;
      background: var(--surface-3); border-radius: var(--radius-sm);
    }
    .seg label { position: relative; display: inline-flex; }
    .seg input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
    .seg span {
      display: inline-flex; align-items: center; min-height: calc(var(--hit) - 6px); padding: 0 10px;
      border-radius: 8px; font-size: .8rem; font-weight: 600; color: var(--text-secondary); white-space: nowrap;
    }
    .seg input:checked + span { color: var(--text-main); background: var(--surface); box-shadow: var(--shadow); }
    .seg input:focus-visible + span { outline: 2px solid var(--brand-accent); outline-offset: 1px; }

    /* ---------- Sliders ---------- */
    input[type="range"] {
      width: 100%; min-width: 0; height: 32px; margin: 0;
      background: transparent; cursor: pointer;
      -webkit-appearance: none; appearance: none;
    }
    input[type="range"]:disabled { cursor: not-allowed; opacity: .5; }
    input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: var(--border-strong); }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 18px; height: 18px; margin-top: -7px; border-radius: 50%;
      background: var(--surface); border: 2px solid var(--brand-accent);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
    }
    input[type="range"]::-moz-range-track { height: 4px; border-radius: 4px; background: var(--border-strong); }
    input[type="range"]::-moz-range-thumb {
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--surface); border: 2px solid var(--brand-accent);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
    }
    input[type="range"]:focus-visible { outline: 2px solid var(--brand-accent); outline-offset: 2px; border-radius: 4px; }
    @media (pointer: coarse) {
      input[type="range"] { height: var(--hit); }
      input[type="range"]::-webkit-slider-thumb { width: 24px; height: 24px; margin-top: -10px; }
      .readout-btn { min-height: var(--hit); }
    }

    .readout {
      font-family: var(--font-mono); font-size: .78rem; color: var(--text-main);
      white-space: nowrap; text-align: right;
    }
    .readout-btn {
      min-height: 32px; padding: 0 6px; text-align: center;
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    }
    .readout-btn:hover:not(:disabled) { border-color: var(--brand-accent); }
    .readout-btn:disabled { cursor: not-allowed; opacity: .6; }

    /* ---------- Combined output ---------- */
    .panel-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .panel-head h2 { margin: 0; font: 500 .98rem var(--font-display); letter-spacing: -.02em; }
    .head-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .head-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #activeSummary { margin: 0; font-size: .78rem; font-weight: 600; color: var(--text-secondary); }

    #combinedCanvasWrap {
      position: relative; flex: 1; min-height: 160px;
      border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden;
      background: var(--canvas-bg);
    }
    #combinedCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .plot-note { margin: -2px 0 0; font-size: .74rem; line-height: 1.4; color: var(--text-muted); }

    .master-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .control-block {
      min-width: 0; padding: 8px 10px 4px;
      background: var(--surface-alt); border: 1px solid var(--border); border-radius: var(--radius-sm);
    }
    .control-header { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
    .control-header label {
      font-size: .68rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
      color: var(--text-secondary); white-space: nowrap;
    }

    /* ---------- Channels ---------- */
    /* Scrolls only on very short screens; laptops fit without it. */
    #channelsList { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }

    .channel-card {
      flex: 1 0 auto;
      display: flex; flex-direction: column; gap: 8px;
      padding: 10px 12px 12px;
      background: var(--surface-alt); border: 1px solid var(--border); border-radius: var(--radius);
      transition: border-color .2s ease;
    }
    .channel-card[data-state="playing"] { border-color: color-mix(in srgb, var(--brand-accent) 55%, var(--border)); }

    .ch-head { display: flex; align-items: center; gap: 8px; min-height: var(--hit); }
    .ch-swatch { width: 10px; height: 10px; flex: none; border-radius: 3px; background: var(--ch1-line); }
    .channel-card[data-index="1"] .ch-swatch { background: var(--ch2-line); }
    .ch-title { margin: 0; font-size: .98rem; font-weight: 700; white-space: nowrap; }
    .ch-actions { margin-left: auto; display: inline-flex; gap: 6px; }

    .ch-row { display: grid; align-items: center; gap: 8px; }
    .ch-freq { grid-template-columns: 4.6rem auto auto minmax(0, 1fr); }
    .ch-mix { grid-template-columns: 4.6rem minmax(0, 1fr) 3rem auto minmax(0, 1fr) 4.6rem; }
    .ch-mix [data-role="pan-label"] { padding-left: 8px; }
    .row-label { font-size: .79rem; font-weight: 600; color: var(--text-secondary); white-space: nowrap; }
    .unit { font-size: .79rem; color: var(--text-muted); }

    .stepper { display: inline-grid; grid-template-columns: var(--hit) 5.2rem var(--hit); gap: 4px; }
    .step-btn {
      min-height: var(--hit); padding: 0;
      font-size: 1.15rem; font-weight: 700; color: var(--text-main);
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
      touch-action: manipulation; -webkit-user-select: none; user-select: none;
    }
    .step-btn:hover:not(:disabled) { background: var(--surface-3); border-color: var(--border-strong); }
    .step-input {
      min-width: 0; min-height: var(--hit); padding: 0 4px; text-align: center;
      font-family: var(--font-mono); font-size: .92rem; color: var(--text-main);
      background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
      -moz-appearance: textfield; appearance: textfield;
    }
    .step-input::-webkit-outer-spin-button, .step-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    .ch-plot {
      position: relative; flex: 1; min-height: 56px;
      border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden;
      background: var(--canvas-bg);
    }
    .channel-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    #addChannelSlot {
      flex: 1 1 0; min-height: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border: 1.5px dashed var(--border-strong); border-radius: var(--radius);
    }
    #emptyState { margin: 0; padding: 12px; text-align: center; font-size: .86rem; font-weight: 600; color: var(--text-secondary); }

    /* Narrower desktops: icon-only channel buttons keep each card header on one line. */
    @media (max-width: 1240px) {
      .ch-actions .tool:not(.tool-icon) span { display: none; }
      .ch-actions .tool:not(.tool-icon) { width: var(--hit); padding: 0; }
      .master-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    /* Tablets and phones: stack the panels and let the page scroll. */
    @media (max-width: 950px) {
      #app { height: auto; min-height: 100dvh; }
      #workspace { flex: none; grid-template-columns: 1fr; padding: 10px; gap: 10px; }
      #combinedCanvasWrap { flex: none; height: 240px; }
      #channelsList { flex: none; }
      .channel-card { flex: none; }
      .ch-plot { flex: none; height: 110px; }
      #addChannelSlot { flex: none; min-height: 110px; }
      .ch-actions .tool:not(.tool-icon) span { display: inline; }
      .ch-actions .tool:not(.tool-icon) { width: auto; padding: 0 12px; }
    }

    @media (max-width: 600px) {
      .audio-appbar { padding-inline: 12px; gap: 8px; }
      .audio-brand h1 { font-size: .9rem; }
      .ch-head { flex-wrap: wrap; }
      .ch-mix { grid-template-columns: 4.6rem minmax(0, 1fr) 4.6rem; }
      .ch-mix [data-role="pan-label"] { padding-left: 0; }
      .ch-freq { grid-template-columns: 4.6rem auto minmax(0, 1fr); }
      .ch-freq .unit { display: none; }
      .stepper { grid-template-columns: var(--hit) 4.6rem var(--hit); }
      .ch-freq input[type="range"] { grid-column: 1 / -1; }
      .audio-statusbar-legal { white-space: normal; text-align: right; }
    }
  </style>
  <link rel="stylesheet" href="/assets/theme-toggle.css">
  <link rel="stylesheet" href="/assets/fullscreen-button.css">
  <script src="/assets/theme-toggle.js"></script>
  <script src="/assets/fullscreen-button.js"></script>
  <link rel="stylesheet" href="/assets/footer.css">
</head>

<body>
  <div id="app">
    <header class="audio-appbar">
      <div class="audio-brand"><a href="/" aria-label="PanPhy Labs home" title="PanPhy Labs home"><img src="/assets/panphy.png" alt="PanPhy logo"></a><h1>Tone Generator</h1></div>
      <div class="banner-actions">
        <button id="theme-button" data-panphy-theme-toggle aria-label="Toggle Light/Dark Theme" title="Toggle between light and dark themes"></button>
        <button data-panphy-fullscreen aria-label="Enter fullscreen" title="Enter fullscreen"></button>
      </div>
    </header>

    <main id="workspace">
      <section id="outputPanel" class="panel" aria-labelledby="outputTitle">
        <div class="panel-head">
          <button id="toggleCombinedBtn" class="play-main" type="button" disabled><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="fill" d="M7.5 5.2v13.6a.8.8 0 0 0 1.2.7l10.6-6.8a.8.8 0 0 0 0-1.4L8.7 4.5a.8.8 0 0 0-1.2.7z"/></svg><span>Play</span></button>
          <div class="head-text">
            <h2 id="outputTitle">Combined Output</h2>
            <div class="head-meta">
              <span id="combinedStateChip" class="state-chip">Paused</span>
              <p id="activeSummary">0 of 0 channels on</p>
            </div>
          </div>
        </div>
        <div id="combinedCanvasWrap">
          <canvas id="combinedCanvas" role="img" aria-label="Combined waveform of the channels that are on"></canvas>
        </div>
        <p class="plot-note">Channels added together, as heard midway between the speakers; panned channels differ at each speaker.</p>
        <div class="master-grid">
          <div class="control-block">
            <div class="control-header">
              <label for="volumeSlider">Volume</label>
              <output id="volumeValue" class="readout" for="volumeSlider">100%</output>
            </div>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
          </div>
          <div class="control-block">
            <div class="control-header">
              <label for="panningSlider">Master Pan</label>
              <output id="panningValue" class="readout" for="panningSlider">Center</output>
            </div>
            <input type="range" id="panningSlider" min="-1" max="1" step="0.05" value="0" title="Pans the whole mix. Double-click to center.">
          </div>
          <div class="control-block">
            <div class="control-header">
              <label for="timeScaleSlider">Animation Speed</label>
              <output id="timeScaleValue" class="readout" for="timeScaleSlider">1&times;</output>
            </div>
            <input type="range" id="timeScaleSlider" min="-3" max="1" step="0.01" value="0" title="Slows the drawing down; the sound is unchanged. Double-click for real time.">
          </div>
          <div class="control-block">
            <div class="control-header">
              <label for="zoomScaleSlider">Time Shown</label>
              <output id="zoomScaleValue" class="readout" for="zoomScaleSlider">10 ms</output>
            </div>
            <input type="range" id="zoomScaleSlider" min="-2" max="1.7" step="0.01" value="0" title="Time across the width of each plot. Double-click for 10 ms.">
          </div>
        </div>
      </section>

      <section id="channelsPanel" class="panel" aria-label="Channels">
        <div id="channelsList">
          <div id="addChannelSlot">
            <button id="addChannelBtn" class="tool" type="button"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg><span>Add Channel</span></button>
          </div>
        </div>
      </section>
    </main>

    <footer class="audio-statusbar panphy-footer">
      <span id="transportHint">Space: play / pause</span>
      <span class="panphy-footer-legal">&copy; 2026 <a href="https://panphy.app/" target="_blank" rel="noopener noreferrer">PanPhy Labs</a>. All rights reserved. &middot;
        <a href="https://buymeacoffee.com/panphy" target="_blank" rel="noopener noreferrer">Support my projects</a></span>
    </footer>
  </div>

  <template id="channelTemplate">
    <article class="channel-card" data-state="paused">
      <div class="ch-head">
        <span class="ch-swatch" aria-hidden="true"></span>
        <h3 class="ch-title" data-role="title">Channel</h3>
        <span class="state-chip" data-role="state">Paused</span>
        <div class="seg" role="radiogroup" data-role="phase">
          <label><input type="radio" value="in" checked><span>In phase</span></label>
          <label><input type="radio" value="anti"><span>Anti-phase</span></label>
        </div>
        <div class="ch-actions">
          <button type="button" class="tool" data-role="toggle"></button>
          <button type="button" class="tool tool-icon tool-danger" data-role="remove"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7M14 10v7"/></svg></button>
        </div>
      </div>
      <div class="ch-row ch-freq">
        <label class="row-label" data-role="freq-label">Frequency</label>
        <div class="stepper">
          <button type="button" class="step-btn" data-role="freq-down">&minus;</button>
          <input type="number" class="step-input" data-role="freq-number" inputmode="numeric" step="1">
          <button type="button" class="step-btn" data-role="freq-up">+</button>
        </div>
        <span class="unit">Hz</span>
        <input type="range" data-role="freq-slider" min="0" max="1000" step="1" title="Logarithmic scale. Use the &minus; and + buttons or type for exact values.">
      </div>
      <div class="ch-row ch-mix">
        <label class="row-label" data-role="level-label">Level</label>
        <input type="range" data-role="level" min="0" max="100" step="1">
        <output class="readout" data-role="level-value">100%</output>
        <label class="row-label" data-role="pan-label">Pan</label>
        <input type="range" data-role="pan" min="-1" max="1" step="0.05" title="Left to right. Double-click to center.">
        <button type="button" class="readout readout-btn" data-role="pan-value" title="Center this channel">Center</button>
      </div>
      <div class="ch-plot"><canvas class="channel-canvas" data-role="canvas"></canvas></div>
    </article>
  </template>

  <script>
    // Theme toggle: the shared script only syncs the icon, so the page wires the click.
    window.PanPhyThemeToggle.mount(document.getElementById('theme-button'));

    (function () {
    const $ = (id) => document.getElementById(id);
    const addChannelBtn = $('addChannelBtn');
    const addChannelSlot = $('addChannelSlot');
    const channelsList = $('channelsList');
    const channelTemplate = $('channelTemplate');

    const combinedCanvas = $('combinedCanvas');
    const combinedCtx = combinedCanvas.getContext('2d');
    const toggleCombinedBtn = $('toggleCombinedBtn');
    const combinedStateChip = $('combinedStateChip');
    const activeSummary = $('activeSummary');

    const volumeSlider = $('volumeSlider');
    const volumeValue = $('volumeValue');
    const panningSlider = $('panningSlider');
    const panningValue = $('panningValue');
    const timeScaleSlider = $('timeScaleSlider');
    const timeScaleValue = $('timeScaleValue');
    const zoomScaleSlider = $('zoomScaleSlider');
    const zoomScaleValue = $('zoomScaleValue');
    const transportHint = $('transportHint');

    const DEFAULT_TRANSPORT_HINT = 'Space: play / pause';
    const AUDIO_BLOCKED_HINT = 'Tap or click to enable audio, then try again.';
    const AUDIO_UNAVAILABLE_HINT = 'Audio output is unavailable in this browser.';

    // Decorative icons; each button keeps a text label or aria-label for its name.
    const ICONS = {
      play: '<path class="fill" d="M7.5 5.2v13.6a.8.8 0 0 0 1.2.7l10.6-6.8a.8.8 0 0 0 0-1.4L8.7 4.5a.8.8 0 0 0-1.2.7z"/>',
      pause: '<rect class="fill" x="6.5" y="5" width="3.6" height="14" rx="1"/><rect class="fill" x="13.9" y="5" width="3.6" height="14" rx="1"/>'
    };
    function setIconButton(button, label, icon) {
      button.innerHTML = '<svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
        ICONS[icon] + '</svg><span>' + label + '</span>';
    }

    function setAudioUnavailableState(message) {
      transportHint.textContent = message || AUDIO_UNAVAILABLE_HINT;
      combinedStateChip.className = 'state-chip';
      combinedStateChip.textContent = 'Unavailable';
      activeSummary.textContent = 'Audio unavailable';
      [addChannelBtn, toggleCombinedBtn, volumeSlider, panningSlider, timeScaleSlider, zoomScaleSlider]
        .forEach((control) => { control.disabled = true; });
    }

    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    if (AudioContextClass) {
      try {
        audioCtx = new AudioContextClass({ latencyHint: 'interactive' });
      } catch (_) {
        try {
          audioCtx = new AudioContextClass();
        } catch (_) {
          audioCtx = null;
        }
      }
    }

    if (!audioCtx) {
      setAudioUnavailableState(AUDIO_UNAVAILABLE_HINT);
      return;
    }

    // Graph: oscillator -> voice gain -> channel gain -> channel panner -> bus
    //        -> volume -> combined (play/pause) -> master panner -> speakers.
    const channelBus = audioCtx.createGain();
    const volumeGain = audioCtx.createGain();
    const combinedGain = audioCtx.createGain();
    combinedGain.gain.value = 0;

    let stereoPanner = null;
    if (typeof audioCtx.createStereoPanner === 'function') {
      try {
        stereoPanner = audioCtx.createStereoPanner();
      } catch (_) {
        stereoPanner = null;
      }
    }
    const supportsStereoPanner = Boolean(stereoPanner);

    channelBus.connect(volumeGain);
    volumeGain.connect(combinedGain);
    if (stereoPanner) {
      combinedGain.connect(stereoPanner);
      stereoPanner.connect(audioCtx.destination);
    } else {
      combinedGain.connect(audioCtx.destination);
      panningSlider.disabled = true;
      panningValue.textContent = 'N/A';
    }

    const MIN_FREQUENCY_HZ = 15;
    const MAX_FREQUENCY_HZ = Math.max(
      MIN_FREQUENCY_HZ,
      Math.min(23000, Math.floor(audioCtx.sampleRate / 2) - 1)
    );
    const LOG_FREQ_MIN = Math.log(MIN_FREQUENCY_HZ);
    const LOG_FREQ_MAX = Math.log(MAX_FREQUENCY_HZ);
    const FREQ_SLIDER_STEPS = 1000;
    const MAX_CHANNELS = 2;
    const BASE_WINDOW = 0.01;
    const CROSSFADE_S = 0.015;
    const INTERACTIVE_TAGS = new Set(['INPUT', 'TEXTAREA', 'SELECT', 'BUTTON', 'OUTPUT']);
    const PHASE_MODE_IN = 'in';
    const PHASE_MODE_ANTI = 'anti';
    const STEPPER_HOLD_DELAY_MS = 400;
    const STEPPER_REPEAT_START_MS = 140;
    const STEPPER_REPEAT_MIN_MS = 35;

    const channels = [];
    let nextChannelId = 1;
    let combinedPlaying = false;
    let timeScale = 1;
    let zoomScale = 1;
    let masterPan = 0;
    let lastFrameTime = null;
    let needsDraw = true;
    let audioPrimed = false;

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function requestRedraw() {
      needsDraw = true;
    }

    // ---------- Audio helpers ----------

    // Short linear ramps avoid clicks. Each ramp is recorded, so the next one starts
    // from the exact level at that moment. (Relying on cancelAndHoldAtTime alone fails
    // when nothing is scheduled after it: the new ramp then starts from the previous
    // event, possibly seconds earlier, and the level jumps.)
    const rampRecords = new WeakMap();

    function scheduledValue(param, time) {
      const record = rampRecords.get(param);
      if (!record) return param.value;
      if (time >= record.t1) return record.to;
      if (time <= record.t0) return record.from;
      return record.from + (record.to - record.from) * (time - record.t0) / (record.t1 - record.t0);
    }

    function rampParam(param, targetValue, duration = 0.012, startTime = audioCtx.currentTime) {
      const from = scheduledValue(param, startTime);
      const record = rampRecords.get(param);
      const insideRamp = record && record.t0 < startTime && startTime < record.t1;
      // Hold keeps a ramp that is still running when startTime falls inside it; the
      // explicit value then anchors the new ramp in every case. Without hold, the cut
      // ramp is redrawn up to startTime.
      if (typeof param.cancelAndHoldAtTime === 'function') {
        param.cancelAndHoldAtTime(startTime);
        param.setValueAtTime(from, startTime);
      } else {
        param.cancelScheduledValues(startTime);
        if (insideRamp) {
          param.linearRampToValueAtTime(from, startTime);
        } else {
          param.setValueAtTime(from, startTime);
        }
      }
      param.linearRampToValueAtTime(targetValue, startTime + duration);
      rampRecords.set(param, { from, to: targetValue, t0: startTime, t1: startTime + duration });
    }

    function setGain(node, targetValue) {
      rampParam(node.gain, targetValue);
    }

    function primeAudioContext() {
      if (audioPrimed) return;
      try {
        const source = audioCtx.createBufferSource();
        source.buffer = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);
        source.connect(audioCtx.destination);
        source.start(audioCtx.currentTime);
        source.stop(audioCtx.currentTime + 0.001);
        audioPrimed = true;
      } catch (_) {
        // If priming fails, the normal playback path still runs.
      }
    }

    // A voice is one oscillator with its own fade gain, so a channel can swap
    // oscillators with a short crossfade instead of a click.
    function createVoice(channel, startTime, fadeIn) {
      const oscillator = audioCtx.createOscillator();
      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(channel.frequency, startTime);
      const fade = audioCtx.createGain();
      fade.gain.value = fadeIn ? 0 : 1;
      if (fadeIn) {
        rampParam(fade.gain, 1, CROSSFADE_S, startTime);
      }
      oscillator.connect(fade);
      fade.connect(channel.gainNode);
      oscillator.start(startTime);
      return { oscillator, fade };
    }

    function retireVoice(voice, startTime) {
      if (!voice) return;
      rampParam(voice.fade.gain, 0, CROSSFADE_S, startTime);
      voice.oscillator.onended = () => {
        try {
          voice.oscillator.disconnect();
          voice.fade.disconnect();
        } catch (_) {
          // Already disconnected.
        }
      };
      try {
        voice.oscillator.stop(startTime + CROSSFADE_S + 0.005);
      } catch (_) {
        // Already stopped.
      }
    }

    // Restart every channel's oscillator at the same instant, so channels set to the
    // same frequency are exactly in (or anti-) phase. Each swap is a crossfade, and the
    // plots restart at phase zero with the sound.
    function resyncRunningOscillators() {
      if (audioCtx.state !== 'running' || channels.length === 0) return;
      const startAt = audioCtx.currentTime + 0.01;
      channels.forEach((channel) => {
        const oldVoice = channel.voice;
        channel.voice = createVoice(channel, startAt, Boolean(oldVoice));
        retireVoice(oldVoice, startAt);
        channel.waveTime = 0;
      });
      requestRedraw();
    }

    function getChannelAmplitude(channel) {
      if (!channel) return 1;
      return clamp(Number.isFinite(channel.amplitude) ? channel.amplitude : 1, 0, 1);
    }

    // Anti-phase inverts the channel gain to -1, so the Web Audio mixer performs real
    // destructive interference: equal tones in anti-phase on the same speaker sum to zero.
    function getChannelOutputGain(channel) {
      if (!channel || !channel.isPlaying) return 0;
      const polarity = channel.phaseMode === PHASE_MODE_ANTI ? -1 : 1;
      return polarity * getChannelAmplitude(channel);
    }

    function setChannelOutputGain(channel) {
      if (channel && channel.gainNode) {
        setGain(channel.gainNode, getChannelOutputGain(channel));
      }
    }

    function formatPan(pan) {
      if (Math.abs(pan) < 0.001) return 'Center';
      return (pan < 0 ? 'L ' : 'R ') + Math.round(Math.abs(pan) * 100) + '%';
    }

    function snapPan(rawPan) {
      const pan = Number.isFinite(rawPan) ? rawPan : 0;
      return clamp(Math.round(pan * 20) / 20, -1, 1);
    }

    // Equal-power gains of a StereoPannerNode fed a mono signal.
    function monoPanGains(pan) {
      const x = (pan + 1) / 2;
      return [Math.cos(x * Math.PI / 2), Math.sin(x * Math.PI / 2)];
    }

    // A StereoPannerNode fed a stereo signal moves one side into the other.
    function stereoPanGains(left, right, pan) {
      if (pan <= 0) {
        const x = pan + 1;
        return [left + right * Math.cos(x * Math.PI / 2), right * Math.sin(x * Math.PI / 2)];
      }
      return [left * Math.cos(pan * Math.PI / 2), right + left * Math.sin(pan * Math.PI / 2)];
    }

    // How much of a channel reaches each speaker after its own pan and the master pan.
    function getChannelSpeakerGains(channel) {
      if (!channel.panner) {
        return stereoPanner ? monoPanGains(masterPan) : [1, 1];
      }
      const [left, right] = monoPanGains(channel.pan);
      return stereoPanner ? stereoPanGains(left, right, masterPan) : [left, right];
    }

    // Two tones can line up and add, so keep the worst-case peak at each
    // speaker at or below 1 (full scale), allowing for every pan setting.
    function updateChannelBusNormalization() {
      let peakLeft = 0;
      let peakRight = 0;
      channels.forEach((channel) => {
        if (!channel.isPlaying) return;
        const amplitude = getChannelAmplitude(channel);
        const [left, right] = getChannelSpeakerGains(channel);
        peakLeft += amplitude * Math.abs(left);
        peakRight += amplitude * Math.abs(right);
      });
      const peak = Math.max(peakLeft, peakRight);
      setGain(channelBus, peak > 1 ? 1 / peak : 1);
    }

    async function ensureAudioContext() {
      if (audioCtx.state === 'running') {
        primeAudioContext();
        if (channels.some((channel) => !channel.voice)) {
          syncPhaseModesToReference();
        }
        return true;
      }
      try {
        await audioCtx.resume();
      } catch (_) {
        // Retry once; iPad Safari can transiently reject the first resume attempt.
      }
      if (audioCtx.state !== 'running') {
        try {
          await audioCtx.resume();
        } catch (_) {
          // Reported as blocked below.
        }
      }
      const running = audioCtx.state === 'running';
      if (running) {
        primeAudioContext();
        syncPhaseModesToReference();
      }
      return running;
    }

    function setAudioBlockedHint() {
      transportHint.textContent = AUDIO_BLOCKED_HINT;
    }

    function setAudioReadyHint() {
      transportHint.textContent = DEFAULT_TRANSPORT_HINT;
    }

    // ---------- Phase ----------

    function getPhaseOffsetForMode(mode) {
      return mode === PHASE_MODE_ANTI ? Math.PI : 0;
    }

    function updateChannelPhaseToggle(channel) {
      const isSecondChannel = channels[1] === channel;
      channel.phaseGroup.hidden = !isSecondChannel;
      channel.phaseInputs.forEach((input) => {
        input.checked = input.value === channel.phaseMode;
      });
    }

    function syncPhaseModesToReference(options = {}) {
      if (channels.length === 0) return;
      channels.forEach((channel, index) => {
        if (index === 0) {
          channel.phaseMode = PHASE_MODE_IN;
        } else if (channel.phaseMode !== PHASE_MODE_ANTI) {
          channel.phaseMode = PHASE_MODE_IN;
        }
        channel.phaseOffsetRad = getPhaseOffsetForMode(channel.phaseMode);
        updateChannelPhaseToggle(channel);
        setChannelOutputGain(channel);
      });
      if (options.resyncAudio !== false) {
        resyncRunningOscillators();
      }
      requestRedraw();
    }

    function setChannelPhaseMode(channel, mode) {
      if (!channel) return;
      channel.phaseMode = channel !== channels[0] && mode === PHASE_MODE_ANTI ? PHASE_MODE_ANTI : PHASE_MODE_IN;
      syncPhaseModesToReference();
    }

    // ---------- Channel values ----------

    function freqToSlider(frequency) {
      return Math.round((Math.log(frequency) - LOG_FREQ_MIN) / (LOG_FREQ_MAX - LOG_FREQ_MIN) * FREQ_SLIDER_STEPS);
    }

    function sliderToFreq(value) {
      return Math.exp(LOG_FREQ_MIN + (value / FREQ_SLIDER_STEPS) * (LOG_FREQ_MAX - LOG_FREQ_MIN));
    }

    // options.fromSlider leaves the slider where the pointer put it (log steps are finer
    // than 1 Hz at low frequencies); options.skipResync is for drags and held steppers.
    function applyFrequency(channel, rawFrequency, options = {}) {
      const frequency = Math.round(clamp(Number.isFinite(rawFrequency) ? rawFrequency : channel.frequency, MIN_FREQUENCY_HZ, MAX_FREQUENCY_HZ));
      channel.frequency = frequency;
      if (channel.voice) {
        channel.voice.oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
      }
      if (!options.fromSlider) {
        channel.freqSlider.value = String(freqToSlider(frequency));
      }
      channel.freqNumber.value = String(frequency);
      requestRedraw();
      if (!options.skipResync) {
        resyncRunningOscillators();
      }
    }

    function stepFrequency(channel, direction, size, options) {
      const current = channel.frequency;
      const next = direction > 0
        ? Math.floor(current / size) * size + size
        : Math.ceil(current / size) * size - size;
      applyFrequency(channel, next, options);
    }

    function applyAmplitudePercent(channel, rawPercent) {
      const percent = clamp(Number.isFinite(rawPercent) ? Math.round(rawPercent) : 100, 0, 100);
      channel.amplitude = percent / 100;
      channel.levelSlider.value = String(percent);
      channel.levelValue.textContent = percent + '%';
      setChannelOutputGain(channel);
      updateChannelBusNormalization();
      requestRedraw();
    }

    function updateChannelPanUi(channel) {
      if (!channel.panner) {
        channel.panValueBtn.textContent = 'N/A';
        return;
      }
      channel.panSlider.value = String(channel.pan);
      channel.panValueBtn.textContent = formatPan(channel.pan);
      channel.panValueBtn.setAttribute('aria-label', `${channel.name} pan ${formatPan(channel.pan)}. Press to center.`);
    }

    function applyChannelPan(channel, rawPan) {
      if (!channel || !channel.panner) return;
      channel.pan = snapPan(rawPan);
      rampParam(channel.panner.pan, channel.pan);
      updateChannelPanUi(channel);
      updateChannelBusNormalization();
    }

    function applyMasterPan(rawPan) {
      if (!stereoPanner) return;
      masterPan = snapPan(rawPan);
      panningSlider.value = String(masterPan);
      rampParam(stereoPanner.pan, masterPan);
      updateControlReadouts();
      updateChannelBusNormalization();
    }

    // ---------- Readouts and state ----------

    function formatSpeed(value) {
      if (Math.abs(value - 1) < 0.005) return '1×';
      return (value >= 1 ? value.toFixed(2) : String(Number(value.toPrecision(2)))) + '×';
    }

    function formatWindow(seconds) {
      const ms = seconds * 1000;
      if (ms < 1) return ms.toFixed(2) + ' ms';
      if (ms < 10) return ms.toFixed(1) + ' ms';
      return Math.round(ms) + ' ms';
    }

    function updateControlReadouts() {
      volumeValue.textContent = Math.round(parseFloat(volumeSlider.value) * 100) + '%';
      panningValue.textContent = stereoPanner ? formatPan(masterPan) : 'N/A';
      timeScaleValue.textContent = formatSpeed(timeScale);
      zoomScaleValue.textContent = formatWindow(BASE_WINDOW * zoomScale);
      requestRedraw();
    }

    function refreshChannelTitles() {
      channels.forEach((channel, index) => {
        const name = `Channel ${index + 1}`;
        channel.name = name;
        channel.card.dataset.index = String(index);
        channel.title.textContent = name;
        channel.freqSlider.setAttribute('aria-label', `${name} frequency`);
        channel.freqNumber.setAttribute('aria-label', `${name} frequency in hertz`);
        channel.freqDown.setAttribute('aria-label', `Lower ${name} frequency`);
        channel.freqUp.setAttribute('aria-label', `Raise ${name} frequency`);
        channel.levelSlider.setAttribute('aria-label', `${name} level`);
        channel.panSlider.setAttribute('aria-label', `${name} pan`);
        channel.phaseGroup.setAttribute('aria-label', `${name} phase relative to Channel 1`);
        channel.removeBtn.setAttribute('aria-label', `Remove ${name}`);
        channel.removeBtn.title = `Remove ${name}`;
        updateChannelPanUi(channel);
        syncChannelUi(channel);
      });
    }

    function syncChannelUi(channel) {
      let state = 'paused';
      let label = 'Paused';
      if (channel.isPlaying && combinedPlaying) {
        state = 'playing';
        label = 'Playing';
      } else if (channel.isPlaying) {
        state = 'ready';
        label = 'Ready';
      }
      channel.card.dataset.state = state;
      channel.stateChip.className = 'state-chip ' + state;
      channel.stateChip.textContent = label;
      channel.stateChip.title = state === 'ready' ? 'On, waiting for Combined Output to play' : '';

      setIconButton(channel.toggleBtn, channel.isPlaying ? 'Pause' : 'Play', channel.isPlaying ? 'pause' : 'play');
      channel.toggleBtn.setAttribute('aria-label', `${channel.isPlaying ? 'Pause' : 'Play'} ${channel.name || 'channel'}`);
      requestRedraw();
    }

    function syncCombinedUi() {
      if (channels.length === 0) {
        combinedStateChip.className = 'state-chip';
        combinedStateChip.textContent = 'No channels';
      } else if (combinedPlaying) {
        combinedStateChip.className = 'state-chip playing';
        combinedStateChip.textContent = 'Playing';
      } else {
        combinedStateChip.className = 'state-chip';
        combinedStateChip.textContent = 'Paused';
      }
      setIconButton(toggleCombinedBtn, combinedPlaying ? 'Pause' : 'Play', combinedPlaying ? 'pause' : 'play');
      toggleCombinedBtn.classList.toggle('is-playing', combinedPlaying);
      toggleCombinedBtn.disabled = channels.length === 0;
      requestRedraw();
    }

    function refreshSummary() {
      const activeCount = channels.filter((channel) => channel.isPlaying).length;
      activeSummary.textContent = `${activeCount} of ${channels.length} channel${channels.length === 1 ? '' : 's'} on`;
      updateChannelBusNormalization();

      const reachedMaxChannels = channels.length >= MAX_CHANNELS;
      addChannelBtn.disabled = reachedMaxChannels;
      addChannelSlot.hidden = reachedMaxChannels;
      addChannelBtn.querySelector('span').textContent = channels.length === 0 ? 'Add Channel' : `Add Channel ${channels.length + 1}`;

      if (channels.length === 0 && combinedPlaying) {
        combinedPlaying = false;
        setGain(combinedGain, 0);
      }
      syncCombinedUi();
      requestAnimationFrame(resizeAllCanvases);
    }

    // ---------- Channels ----------

    async function toggleChannel(channel) {
      const ready = await ensureAudioContext();
      if (!ready) {
        setAudioBlockedHint();
        return;
      }
      setAudioReadyHint();
      channel.isPlaying = !channel.isPlaying;
      setChannelOutputGain(channel);
      if (channel.isPlaying && channels.length > 1) {
        resyncRunningOscillators();
      }
      syncChannelUi(channel);
      refreshSummary();
    }

    function removeChannel(channel) {
      const index = channels.indexOf(channel);
      if (index === -1) return;
      channels.splice(index, 1);

      // Fade out before disconnecting, so removing a sounding channel does not click.
      setGain(channel.gainNode, 0);
      const voice = channel.voice;
      channel.voice = null;
      retireVoice(voice, audioCtx.currentTime + 0.015);
      setTimeout(() => {
        try {
          channel.gainNode.disconnect();
          if (channel.panner) channel.panner.disconnect();
        } catch (_) {
          // Already disconnected.
        }
      }, 80);

      canvasObserver.unobserve(channel.canvas);
      channel.card.remove();

      refreshChannelTitles();
      syncPhaseModesToReference();
      refreshSummary();
      if (channels.length === 0) {
        renderEmptyState();
      }
    }

    function renderEmptyState() {
      if ($('emptyState')) return;
      const empty = document.createElement('p');
      empty.id = 'emptyState';
      empty.textContent = 'No channels yet. Add a channel to begin mixing.';
      addChannelSlot.prepend(empty);
    }

    function clearEmptyState() {
      const empty = $('emptyState');
      if (empty) empty.remove();
    }

    function bindFrequencyStepper(channel, button, direction) {
      let holdTimer = 0;
      let repeatDelay = STEPPER_REPEAT_START_MS;
      let repeats = 0;
      let holding = false;
      const stepSize = () => (repeats > 40 ? 100 : repeats > 12 ? 10 : 1);
      const repeat = () => {
        repeats += 1;
        stepFrequency(channel, direction, stepSize(), { skipResync: true });
        repeatDelay = Math.max(STEPPER_REPEAT_MIN_MS, repeatDelay * 0.85);
        holdTimer = setTimeout(repeat, repeatDelay);
      };
      const stopHold = () => {
        if (!holding) return;
        holding = false;
        clearTimeout(holdTimer);
        resyncRunningOscillators();
      };
      button.addEventListener('pointerdown', (event) => {
        if (button.disabled || (event.pointerType === 'mouse' && event.button !== 0)) return;
        event.preventDefault();
        holding = true;
        repeats = 0;
        repeatDelay = STEPPER_REPEAT_START_MS;
        stepFrequency(channel, direction, 1, { skipResync: true });
        clearTimeout(holdTimer);
        holdTimer = setTimeout(repeat, STEPPER_HOLD_DELAY_MS);
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach((type) => button.addEventListener(type, stopHold));
      button.addEventListener('click', (event) => {
        // Keyboard activation reports detail 0; pointer presses were handled on pointerdown.
        if (event.detail === 0) stepFrequency(channel, direction, 1);
      });
    }

    function addChannel(options = {}) {
      if (channels.length >= MAX_CHANNELS) {
        refreshSummary();
        return false;
      }
      clearEmptyState();

      const channel = {
        id: nextChannelId,
        name: 'Channel',
        frequency: Math.round(clamp(Number.isFinite(options.frequency) ? options.frequency : 440, MIN_FREQUENCY_HZ, MAX_FREQUENCY_HZ)),
        amplitude: Number.isFinite(options.amplitude) ? clamp(options.amplitude, 0, 1) : 1,
        isPlaying: options.isPlaying === undefined ? true : Boolean(options.isPlaying),
        waveTime: channels[0] ? channels[0].waveTime : 0,
        phaseMode: PHASE_MODE_IN,
        phaseOffsetRad: 0,
        pan: snapPan(options.pan),
        voice: null
      };
      nextChannelId += 1;

      channel.gainNode = audioCtx.createGain();
      channel.gainNode.gain.value = 0;
      let panner = null;
      if (supportsStereoPanner) {
        try {
          panner = audioCtx.createStereoPanner();
          panner.pan.value = channel.pan;
        } catch (_) {
          panner = null;
        }
      }
      if (panner) {
        channel.gainNode.connect(panner);
        panner.connect(channelBus);
      } else {
        channel.gainNode.connect(channelBus);
      }
      channel.panner = panner;

      const card = channelTemplate.content.firstElementChild.cloneNode(true);
      const part = (role) => card.querySelector(`[data-role="${role}"]`);
      Object.assign(channel, {
        card,
        title: part('title'),
        stateChip: part('state'),
        phaseGroup: part('phase'),
        toggleBtn: part('toggle'),
        removeBtn: part('remove'),
        freqSlider: part('freq-slider'),
        freqNumber: part('freq-number'),
        freqDown: part('freq-down'),
        freqUp: part('freq-up'),
        levelSlider: part('level'),
        levelValue: part('level-value'),
        panSlider: part('pan'),
        panValueBtn: part('pan-value'),
        canvas: part('canvas')
      });
      channel.ctx = channel.canvas.getContext('2d');
      channel.phaseInputs = Array.from(channel.phaseGroup.querySelectorAll('input'));
      channel.phaseInputs.forEach((input) => { input.name = 'phase-' + channel.id; });

      const ids = { 'freq-number': 'freq-number-', level: 'level-', pan: 'pan-' };
      Object.keys(ids).forEach((role) => { part(role).id = ids[role] + channel.id; });
      part('freq-label').htmlFor = 'freq-number-' + channel.id;
      part('level-label').htmlFor = 'level-' + channel.id;
      part('pan-label').htmlFor = 'pan-' + channel.id;
      channel.levelValue.htmlFor = 'level-' + channel.id;

      channel.freqNumber.min = String(MIN_FREQUENCY_HZ);
      channel.freqNumber.max = String(MAX_FREQUENCY_HZ);
      channel.freqNumber.value = String(channel.frequency);
      channel.freqSlider.value = String(freqToSlider(channel.frequency));
      channel.levelSlider.value = String(Math.round(channel.amplitude * 100));
      channel.levelValue.textContent = Math.round(channel.amplitude * 100) + '%';
      channel.panSlider.value = String(channel.pan);
      if (!panner) {
        channel.panSlider.disabled = true;
        channel.panValueBtn.disabled = true;
        channel.panValueBtn.title = 'Panning is not supported in this browser';
      }

      channelsList.insertBefore(card, addChannelSlot);
      canvasObserver.observe(channel.canvas);

      channel.freqSlider.addEventListener('input', () => {
        applyFrequency(channel, sliderToFreq(parseFloat(channel.freqSlider.value)), { fromSlider: true, skipResync: true });
      });
      channel.freqSlider.addEventListener('change', () => {
        applyFrequency(channel, channel.frequency, { fromSlider: true });
      });
      channel.freqNumber.addEventListener('change', () => {
        applyFrequency(channel, parseFloat(channel.freqNumber.value));
      });
      channel.freqNumber.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') channel.freqNumber.blur();
      });
      bindFrequencyStepper(channel, channel.freqDown, -1);
      bindFrequencyStepper(channel, channel.freqUp, 1);

      channel.levelSlider.addEventListener('input', () => {
        applyAmplitudePercent(channel, parseFloat(channel.levelSlider.value));
      });
      channel.panSlider.addEventListener('input', () => {
        applyChannelPan(channel, parseFloat(channel.panSlider.value));
      });
      channel.panSlider.addEventListener('dblclick', () => applyChannelPan(channel, 0));
      channel.panValueBtn.addEventListener('click', () => applyChannelPan(channel, 0));
      channel.phaseInputs.forEach((input) => {
        input.addEventListener('change', () => {
          if (input.checked) setChannelPhaseMode(channel, input.value);
        });
      });
      channel.toggleBtn.addEventListener('click', () => toggleChannel(channel));
      channel.removeBtn.addEventListener('click', () => removeChannel(channel));

      channels.push(channel);
      refreshChannelTitles();
      syncPhaseModesToReference();
      refreshSummary();
      return true;
    }

    async function toggleCombined() {
      if (channels.length === 0) return;
      if (!combinedPlaying) {
        const ready = await ensureAudioContext();
        if (!ready) {
          setAudioBlockedHint();
          syncCombinedUi();
          return;
        }
        setAudioReadyHint();
        if (channels.length > 1) {
          resyncRunningOscillators();
        }
      }
      combinedPlaying = !combinedPlaying;
      setGain(combinedGain, combinedPlaying ? 1 : 0);
      syncCombinedUi();
      channels.forEach(syncChannelUi);
    }

    // ---------- Drawing ----------

    function getCssVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    let cachedThemeColors = null;
    function getThemeColors() {
      if (!cachedThemeColors) {
        cachedThemeColors = {
          canvasBg: getCssVar('--canvas-bg'),
          axisLine: getCssVar('--axis-line'),
          textMuted: getCssVar('--text-muted'),
          channelLines: [getCssVar('--ch1-line'), getCssVar('--ch2-line')],
          combinedLine: getCssVar('--combined-line')
        };
      }
      return cachedThemeColors;
    }

    new MutationObserver(() => {
      cachedThemeColors = null;
      requestRedraw();
    }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    window.addEventListener('panphy:theme-change', () => {
      cachedThemeColors = null;
      requestRedraw();
    });

    function prepareCanvas(ctx, canvas, colors) {
      const dpr = window.devicePixelRatio || 1;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const width = canvas._cssWidth || 1;
      const height = canvas._cssHeight || 1;
      ctx.fillStyle = colors.canvasBg;
      ctx.fillRect(0, 0, width, height);
      ctx.strokeStyle = colors.axisLine;
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(0, height / 2);
      ctx.lineTo(width, height / 2);
      ctx.stroke();
      ctx.setLineDash([]);
      return { width, height };
    }

    // Draws a signal across the plot; sampleAt(fraction) gives values in [-scale, scale].
    // One sample per pixel would show a false (aliased) wave at high frequencies, so the
    // line is sampled about 24 times per cycle. Once a pixel column holds two or more
    // whole cycles, each column is drawn from its minimum to its maximum instead,
    // which is the true envelope.
    function plotSignal(ctx, width, height, sampleAt, cyclesAcross, scale, color, dimmed) {
      const columns = Math.max(2, Math.round(width));
      const cyclesPerColumn = cyclesAcross / columns;
      const middle = height / 2;
      const amplitude = middle * 0.88;
      const toY = (value) => middle - (value / scale) * amplitude;

      ctx.save();
      ctx.globalAlpha = dimmed ? 0.45 : 1;
      ctx.strokeStyle = color;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      if (cyclesPerColumn < 2) {
        const points = Math.max(columns, Math.ceil(cyclesAcross * 24));
        ctx.lineWidth = cyclesPerColumn < 0.25 ? 2 : 1.25;
        for (let i = 0; i <= points; i += 1) {
          const fraction = i / points;
          const y = toY(sampleAt(fraction));
          if (i === 0) ctx.moveTo(0, y); else ctx.lineTo(fraction * width, y);
        }
      } else {
        const subSamples = Math.min(96, Math.ceil(cyclesPerColumn * 6) + 2);
        ctx.lineWidth = 1.25;
        for (let x = 0; x < columns; x += 1) {
          let low = Infinity;
          let high = -Infinity;
          for (let k = 0; k < subSamples; k += 1) {
            const value = sampleAt((x + k / (subSamples - 1)) / columns);
            if (value < low) low = value;
            if (value > high) high = value;
          }
          ctx.moveTo(x + 0.5, toY(high));
          ctx.lineTo(x + 0.5, toY(low));
        }
      }
      ctx.stroke();
      ctx.restore();
    }

    function drawLabel(ctx, text, x, y, align, colors) {
      ctx.font = '11px "IBM Plex Mono", monospace';
      ctx.textAlign = align;
      const textWidth = ctx.measureText(text).width;
      const left = align === 'right' ? x - textWidth : x;
      ctx.fillStyle = colors.canvasBg;
      ctx.fillRect(left - 5, y - 12, textWidth + 10, 17);
      ctx.fillStyle = colors.textMuted;
      ctx.fillText(text, x, y);
    }

    function drawChannelWave(channel, index, colors) {
      const { width, height } = prepareCanvas(channel.ctx, channel.canvas, colors);
      const timeWindow = BASE_WINDOW * zoomScale;
      const omega = 2 * Math.PI * channel.frequency;
      const amplitude = getChannelAmplitude(channel);
      const phase = channel.phaseOffsetRad || 0;
      const animated = combinedPlaying && channel.isPlaying;
      plotSignal(
        channel.ctx, width, height,
        (fraction) => amplitude * Math.sin(omega * (channel.waveTime - fraction * timeWindow) + phase),
        channel.frequency * timeWindow, 1,
        colors.channelLines[index] || colors.channelLines[0],
        !animated
      );
    }

    function drawCombinedWave(colors) {
      const { width, height } = prepareCanvas(combinedCtx, combinedCanvas, colors);
      const activeChannels = channels.filter((channel) => channel.isPlaying);
      if (activeChannels.length === 0) {
        combinedCtx.fillStyle = colors.textMuted;
        combinedCtx.textAlign = 'center';
        combinedCtx.font = '13px "IBM Plex Mono", monospace';
        combinedCtx.fillText('No channels on', width / 2, height / 2 - 10);
        combinedCtx.fillText('Press Play on a channel to add it to the mix', width / 2, height / 2 + 14);
        return;
      }
      const timeWindow = BASE_WINDOW * zoomScale;
      const terms = activeChannels.map((channel) => ({
        amplitude: getChannelAmplitude(channel),
        omega: 2 * Math.PI * channel.frequency,
        phase: channel.phaseOffsetRad || 0,
        waveTime: channel.waveTime
      }));
      const scale = Math.max(1, terms.reduce((total, term) => total + term.amplitude, 0));
      const maxFrequency = Math.max(...activeChannels.map((channel) => channel.frequency));
      plotSignal(
        combinedCtx, width, height,
        (fraction) => {
          let sum = 0;
          for (const term of terms) {
            sum += term.amplitude * Math.sin(term.omega * (term.waveTime - fraction * timeWindow) + term.phase);
          }
          return sum;
        },
        maxFrequency * timeWindow, scale, colors.combinedLine, !combinedPlaying
      );
      drawLabel(combinedCtx, formatWindow(timeWindow) + ' across', width - 10, height - 10, 'right', colors);
    }

    function draw(timestamp) {
      requestAnimationFrame(draw);
      const deltaSeconds = lastFrameTime === null ? 0 : Math.min((timestamp - lastFrameTime) / 1000, 0.1);
      lastFrameTime = timestamp;

      const animating = combinedPlaying && channels.some((channel) => channel.isPlaying);
      if (animating) {
        const step = deltaSeconds * timeScale;
        channels.forEach((channel) => {
          if (!channel.isPlaying) return;
          channel.waveTime += step;
          // Wrap by a whole number of cycles to keep precision without a phase jump.
          const wrapAt = 1e5 / Math.max(1, channel.frequency);
          if (channel.waveTime > wrapAt) channel.waveTime -= wrapAt;
        });
      }
      // Redraw only while animating or after a change, to save battery.
      if (!animating && !needsDraw) return;
      needsDraw = false;

      const colors = getThemeColors();
      channels.forEach((channel, index) => drawChannelWave(channel, index, colors));
      drawCombinedWave(colors);
    }

    function resizeCanvas(canvas) {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const width = Math.max(1, Math.floor(rect.width * dpr));
      const height = Math.max(1, Math.floor(rect.height * dpr));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
      canvas._cssWidth = width / dpr;
      canvas._cssHeight = height / dpr;
      requestRedraw();
    }

    function resizeAllCanvases() {
      resizeCanvas(combinedCanvas);
      channels.forEach((channel) => resizeCanvas(channel.canvas));
    }

    const canvasObserver = new ResizeObserver((entries) => {
      entries.forEach(({ target }) => resizeCanvas(target));
    });

    // ---------- Controls ----------

    addChannelBtn.addEventListener('click', async () => {
      const ready = await ensureAudioContext();
      if (!ready) {
        setAudioBlockedHint();
        return;
      }
      setAudioReadyHint();
      addChannel({ frequency: 440, isPlaying: true });
    });

    toggleCombinedBtn.addEventListener('click', () => {
      toggleCombined();
    });

    volumeSlider.addEventListener('input', () => {
      setGain(volumeGain, parseFloat(volumeSlider.value));
      updateControlReadouts();
    });

    panningSlider.addEventListener('input', () => applyMasterPan(parseFloat(panningSlider.value)));
    panningSlider.addEventListener('dblclick', () => applyMasterPan(0));

    function applyTimeScale(sliderValue) {
      timeScaleSlider.value = String(sliderValue);
      timeScale = Math.pow(10, sliderValue);
      updateControlReadouts();
    }
    timeScaleSlider.addEventListener('input', () => applyTimeScale(parseFloat(timeScaleSlider.value)));
    timeScaleSlider.addEventListener('dblclick', () => applyTimeScale(0));

    function applyZoom(sliderValue) {
      zoomScaleSlider.value = String(sliderValue);
      zoomScale = Math.min(50, Math.pow(10, sliderValue));
      updateControlReadouts();
    }
    zoomScaleSlider.addEventListener('input', () => applyZoom(parseFloat(zoomScaleSlider.value)));
    zoomScaleSlider.addEventListener('dblclick', () => applyZoom(0));

    document.addEventListener('keydown', (event) => {
      if (event.code !== 'Space' || event.repeat) return;
      const target = event.target;
      const tag = target && target.tagName ? target.tagName.toUpperCase() : '';
      if (INTERACTIVE_TAGS.has(tag) || (target.closest && target.closest('a, summary, label, [contenteditable]'))) return;
      event.preventDefault();
      toggleCombined();
    });

    canvasObserver.observe(combinedCanvas);
    resizeCanvas(combinedCanvas);
    updateControlReadouts();
    syncCombinedUi();
    renderEmptyState();
    addChannel({ frequency: 440, isPlaying: true });
    requestAnimationFrame(draw);
    })();
  </script>
</body>

</html>
