<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F8F6F1">
  <script src="/assets/theme.js" data-legacy-theme="theme"></script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="/assets/standalone-top.css">
  <title>PanPhyMD - Markdown & LaTeX Editor</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
    <script src="/assets/sw-register.js" defer></script>
<!-- MathJax Configuration -->
  <script>
    // Math is tokenized by the Markdown renderer into .math-inline /
    // .math-display elements using \(...\) and \[...\]. MathJax only
    // typesets those elements, so literal $ signs never pair up as math, and
    // typesetting is driven by the app rather than on page load.
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]']],
        processEscapes: false,
        packages: ['base', 'ams', 'array'],
      },
      options: {
        ignoreHtmlClass: 'mathjax-ignore',
        processHtmlClass: 'math-inline|math-display'
      },
      startup: {
        typeset: false
      },
      svg: {
        fontCache: 'local',
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  <!-- Marked.js (pinned to v4.3.0 — the highlight callback requires v4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>

  <!-- DOMPurify -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js"></script>

  <!-- html2canvas (table copy-as-image) -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <!-- Highlight.js Stylesheets -->
  <link id="highlightStyle" rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/default.min.css">

  <!-- Highlight.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

  <!-- External CSS -->
  <link rel="stylesheet" href="panphymd/css/panphymd.css">
  <link rel="stylesheet" href="/assets/theme-toggle.css">
  <link rel="stylesheet" href="/assets/fullscreen-button.css">
  <script src="/assets/theme-toggle.js"></script>
  <script src="/assets/fullscreen-button.js"></script>
</head>

<body>
  <header class="md-appbar no-print">
    <div class="md-brand">
      <a href="https://panphy.app/" aria-label="PanPhy Labs home" title="PanPhy Labs home"><img src="/assets/panphy.png" alt="PanPhy logo" /></a>
      <span class="md-wordmark">PanPhyMD</span>
    </div>
    <!-- Narrow screens show one pane at a time; these tabs switch between them. -->
    <div id="mobileTabBar" class="md-view-switch" role="group" aria-label="Pane">
      <button type="button" class="mobile-tab active" data-pane="input">Edit</button>
      <button type="button" class="mobile-tab" data-pane="output">Preview</button>
    </div>
    <div class="md-appbar-actions">
      <button type="button" id="loadSampleButton" class="md-tool md-tool-quiet" title="Open a sample document showing Markdown and LaTeX syntax"><svg class="md-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5c2.7-1.3 5.4-1.3 8 0v14c-2.6-1.3-5.3-1.3-8 0zM20 5.5c-2.7-1.3-5.4-1.3-8 0v14c2.6-1.3 5.3-1.3 8 0z"/></svg><span>Guide</span></button>
      <button id="themeToggleButton" data-panphy-theme-toggle class="theme-toggle-button" aria-label="Switch to Dark Mode"
        title="Switch to Dark Mode">&#9728;&#65039;</button>
      <button data-panphy-fullscreen aria-label="Enter fullscreen" title="Enter fullscreen"></button>
    </div>
  </header>

  <!-- Two panes: the Markdown editor on the left, the rendered preview on the right. -->
  <main id="editorContainer">
    <section id="inputPane" aria-labelledby="inputPaneTitle">
      <div class="pane-head no-print">
        <h2 class="pane-heading" id="inputPaneTitle">Markdown</h2>
        <p class="pane-hint">Put maths between <code>$&hellip;$</code> or <code>$$&hellip;$$</code></p>
      </div>
      <div class="pane-toolbar no-print" role="toolbar" aria-label="Document tools">
        <div class="md-tool-group" role="group" aria-label="File">
          <button type="button" id="loadFileButton" class="md-tool" title="Open a Markdown file from your device"><svg class="md-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7v10.5a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2V9.5a2 2 0 0 0-2-2H12l-2-2.5H5.5a2 2 0 0 0-2 2z"/></svg><span>Open</span></button>
          <span class="save-wrapper">
            <button type="button" id="saveMDButton" class="md-tool" title="Save the current document as a Markdown file"><svg class="md-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v11M7.5 10l4.5 4.5 4.5-4.5M4.5 15.5v3a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-3"/></svg><span>Save</span></button>
            <span id="dirtyIndicator" class="dirty-indicator" aria-hidden="true"></span>
          </span>
          <button type="button" id="historyButton" class="md-tool" title="Browse saved snapshots"><svg class="md-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4v3.5H8"/><path d="M12 8v4.5l3 1.8"/></svg><span>History</span></button>
        </div>
        <div class="md-tool-group" role="group" aria-label="Edit">
          <div class="insert-menu" id="insertMenu">
            <button type="button" id="insertButton" class="md-tool" aria-expanded="false" aria-controls="insertPanel" title="Insert maths, a table, an image or a page break"><svg class="md-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8.5v7M8.5 12h7"/></svg><span>Insert</span><svg class="md-caret" viewBox="0 0 12 12" aria-hidden="true"><path d="m3 4.5 3 3 3-3"/></svg></button>
            <div id="insertPanel" class="insert-panel md-menu" hidden>
              <button class="insert-action-btn" data-action="image" title="Insert an image from a URL">Image</button>
              <button class="insert-action-btn" data-action="table" title="Insert a Markdown table">Table</button>
              <button class="insert-action-btn" data-action="pagebreak" title="Insert a page break for printing">Page Break</button>
              <div class="insert-math-group" id="insertMathGroup">
                <div class="insert-panel-item insert-has-submenu">
                  <span>Math</span>
                  <span class="insert-chevron" aria-hidden="true">&#8250;</span>
                </div>
                <div class="insert-submenu md-menu">
                  <button class="insert-action-btn" data-template="basic" title="Insert basic math notation examples">Basic</button>
                  <button class="insert-action-btn" data-template="calculus" title="Insert calculus notation examples">Advanced</button>
                  <button class="insert-action-btn" data-template="matrices" title="Insert matrix notation examples">Matrices</button>
                </div>
              </div>
            </div>
          </div>
          <div class="font-menu" id="fontMenu">
            <button type="button" id="fontButton" class="md-tool" aria-expanded="false" aria-controls="fontPanel" title="Change the size of the text in the editor and preview"><svg class="md-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5h10M8.5 6.5V19M14.5 11.5h6M17.5 11.5V19"/></svg><span>Text Size</span><svg class="md-caret" viewBox="0 0 12 12" aria-hidden="true"><path d="m3 4.5 3 3 3-3"/></svg></button>
            <div id="fontPanel" class="font-panel md-menu" hidden>
              <button class="font-option-btn" data-size="14px">Small</button>
              <button class="font-option-btn" data-size="16px">Medium</button>
              <button class="font-option-btn" data-size="18px">Large</button>
              <button class="font-option-btn" data-size="20px">XL</button>
            </div>
          </div>
        </div>
        <div class="md-tool-spacer"></div>
        <button type="button" id="clearButton" class="md-tool md-tool-danger" title="Clear the editor contents"><svg class="md-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 10.5v6M14 10.5v6"/></svg><span>Clear</span></button>
      </div>
      <div id="embeddedImageNotice" class="embedded-image-notice no-print" hidden>
        <span>Embedded images stay in your saved document.</span>
        <button type="button" id="imageDataToggle" aria-controls="markdownInput" aria-pressed="false">Show image data</button>
      </div>
      <textarea id="markdownInput" placeholder="Type your Markdown and LaTeX here..." aria-label="Markdown and LaTeX source"></textarea>
    </section>

    <div id="paneDivider" class="no-print" role="separator" tabindex="0"
      aria-label="Editor width" aria-orientation="vertical" aria-controls="inputPane outputPane"
      aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"
      title="Drag to resize. Use arrow keys to adjust; double-click or press Enter to reset."></div>

    <section id="outputPane" class="mobile-hidden" aria-labelledby="outputPaneTitle">
      <div class="pane-head no-print">
        <h2 class="pane-heading" id="outputPaneTitle">Preview</h2>
        <p class="pane-hint">Click an equation or table to copy it</p>
      </div>
      <div class="pane-toolbar no-print" role="toolbar" aria-label="Preview tools">
        <div class="md-tool-group" role="group" aria-label="Share">
          <button type="button" id="printButton" class="md-tool" title="Print or save as PDF (always in light mode)"><svg class="md-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V4h10v5"/><path d="M7 16.5H5.5a2 2 0 0 1-2-2V11a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2v3.5a2 2 0 0 1-2 2H17"/><path d="M7 13.5h10V20H7z"/></svg><span>Print / PDF</span></button>
          <button type="button" id="exportHTMLButton" class="md-tool" title="Export as an HTML page, in the current theme"><svg class="md-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8.5 8-4 4 4 4M15.5 8l4 4-4 4M13.5 5.5l-3 13"/></svg><span>Export HTML</span></button>
          <button type="button" id="presentButton" class="md-tool" title="Show the preview full screen"><svg class="md-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="11.5" rx="2"/><path d="M12 16v3.5M8 19.5h8"/><path d="m10.5 7.8 4 2.45-4 2.45z"/></svg><span>Present</span></button>
        </div>
        <div class="md-tool-group" role="group" aria-label="View">
          <div class="preview-font-menu" id="previewFontMenu">
            <div class="preview-font-btn-wrapper" id="previewFontBtnWrapper">
              <button type="button" id="previewFontButton" class="md-tool" aria-expanded="false" aria-controls="previewFontPanel" title="Change the typeface of the preview"><svg class="md-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 18.5 8 6l4.5 12.5M5.2 14h5.6"/><circle cx="17.2" cy="15.6" r="2.9"/><path d="M20.1 12.5v6"/></svg><span>Font</span><svg class="md-caret" viewBox="0 0 12 12" aria-hidden="true"><path d="m3 4.5 3 3 3-3"/></svg></button>
              <span class="preview-font-offline-tooltip" role="tooltip">Font selection is available online only</span>
            </div>
            <div id="previewFontPanel" class="preview-font-panel md-menu" hidden>
              <button class="preview-font-option-btn" data-font-key="Manrope">Default</button>
              <button class="preview-font-option-btn" data-font-key="Inter">Inter</button>
              <button class="preview-font-option-btn" data-font-key="Lora">Lora</button>
              <button class="preview-font-option-btn" data-font-key="Merriweather">Merriweather</button>
              <button class="preview-font-option-btn" data-font-key="SourceSerif4">Source Serif</button>
            </div>
          </div>
        </div>
        <div class="md-tool-spacer"></div>
        <label class="md-switch" for="syncScrollToggle" title="Scroll the editor and preview together">
          <input type="checkbox" id="syncScrollToggle" role="switch" />
          <span class="md-switch-track" aria-hidden="true"></span>
          <span>Sync Scroll</span>
        </label>
      </div>
      <div id="renderedOutput" class="mathjax-ignore"></div>
      <div id="presentControls" class="present-controls">
        <div class="present-zoom-menu" id="presentZoomMenu">
          <button type="button" id="presentZoomButton" class="present-btn present-zoom-btn" aria-expanded="false" aria-controls="presentZoomPanel"
            aria-label="Zoom: 100%" title="Zoom"><svg class="md-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.3 15.3 5.2 5.2M7.5 10.5h6M10.5 7.5v6"/></svg><span class="present-zoom-value" id="presentZoomValue">100%</span></button>
          <div id="presentZoomPanel" class="present-zoom-panel md-menu" role="group" aria-label="Zoom" hidden>
            <button type="button" class="present-zoom-option active" data-zoom="100">100%</button>
            <button type="button" class="present-zoom-option" data-zoom="125">125%</button>
            <button type="button" class="present-zoom-option" data-zoom="150">150%</button>
            <button type="button" class="present-zoom-option" data-zoom="200">200%</button>
            <button type="button" class="present-zoom-option" data-zoom="250">250%</button>
          </div>
        </div>
        <button type="button" id="presentLaserToggle" class="present-btn present-icon-btn" aria-pressed="false" aria-label="Laser pointer"
          title="Laser pointer"><svg class="md-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 20.5 7.6-7.6"/><circle class="present-laser-dot" cx="15.5" cy="8.5" r="2.6"/><path d="M15.5 2.5v1.6M15.5 12.9v1.6M21.5 8.5h-1.6M11.1 8.5H9.5M19.7 4.3l-1.1 1.1M12.4 11.6l-1.1 1.1M19.7 12.7l-1.1-1.1M12.4 5.4l-1.1-1.1"/></svg></button>
        <button type="button" id="presentThemeToggle" data-panphy-theme-toggle class="present-btn present-icon-btn" aria-label="Toggle theme"
          title="Toggle theme">&#9728;&#65039;</button>
        <button type="button" id="presentExitButton" class="present-btn present-icon-btn" aria-label="Exit Present"
          title="Exit Present"><svg class="md-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4l-6 6M14 5.5V10h4.5M4 20l6-6M10 18.5V14H5.5"/></svg></button>
      </div>
      <canvas id="laserCanvas" class="laser-canvas"></canvas>
      <div id="laserPointer" class="laser-pointer"></div>
    </section>
  </main>

  <footer class="md-statusbar">
    <span class="md-status"><span id="wordCount"></span><span id="saveStatus" role="status"></span></span>
    <span class="md-statusbar-legal">&copy; 2026 <a href="https://panphy.app/" target="_blank" rel="noopener noreferrer">PanPhy Labs</a>. All rights reserved. &middot;
    <a href="https://buymeacoffee.com/panphy" target="_blank" rel="noopener noreferrer">Support My Projects</a></span>
  </footer>

  <!-- Main Application Script (ES Module) -->
  <script type="module" src="panphymd/js/main.js"></script>
  <div id="copyNotice" class="copy-notice no-print" role="status" aria-live="polite" aria-atomic="true"></div>
</body>

</html>
