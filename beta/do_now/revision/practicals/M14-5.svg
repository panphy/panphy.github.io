<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" width="400" height="270" role="img" font-family="Arial, Helvetica, sans-serif" fill="none" stroke="#0a1326" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><title>A bar chart of the four readings, with the tallest bar showing the best emitter of infrared radiation</title><rect width="400" height="270" fill="#ffffff" stroke="none"/><line x1="60" y1="40" x2="60" y2="200" stroke="#0a1326" stroke-width="3"/><line x1="60" y1="200" x2="360" y2="200" stroke="#0a1326" stroke-width="3"/><text x="60" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1326" stroke="none">reading</text><rect x="84" y="62" width="44" height="138" fill="#0b7fa3" stroke="#0a1326" stroke-width="2.6"/><text x="106" y="222" text-anchor="middle" font-size="17" font-weight="700" fill="#0a1326" stroke="none">A</text><rect x="152" y="113" width="44" height="87" fill="#9fd0e0" stroke="#0a1326" stroke-width="2.6"/><text x="174" y="222" text-anchor="middle" font-size="17" font-weight="700" fill="#0a1326" stroke="none">B</text><rect x="220" y="125" width="44" height="75" fill="#9fd0e0" stroke="#0a1326" stroke-width="2.6"/><text x="242" y="222" text-anchor="middle" font-size="17" font-weight="700" fill="#0a1326" stroke="none">C</text><rect x="288" y="176" width="44" height="24" fill="#9fd0e0" stroke="#0a1326" stroke-width="2.6"/><text x="310" y="222" text-anchor="middle" font-size="17" font-weight="700" fill="#0a1326" stroke="none">D</text><text x="190" y="252" text-anchor="middle" font-size="17" font-weight="700" fill="#d0182b" stroke="none">highest reading = best emitter</text><text x="190" y="46" text-anchor="middle" font-size="1" font-weight="700" fill="#0a1326" stroke="none"></text></svg>
