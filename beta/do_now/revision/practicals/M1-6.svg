<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" width="400" height="270" role="img" font-family="Arial, Helvetica, sans-serif" fill="none" stroke="#0a1326" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><title>The equation for specific heat capacity, c equals E divided by m times delta theta</title><rect width="400" height="270" fill="#ffffff" stroke="none"/><rect x="35" y="52" width="330" height="86" fill="#f3fafc" stroke="#0b7fa3" stroke-width="3" rx="12"/><text x="200" y="92" text-anchor="middle" font-size="27" font-weight="700" fill="#0a1326" stroke="none">c = E ÷ (m × Δθ)</text><text x="200" y="120" text-anchor="middle" font-size="17" font-weight="400" fill="#0a1326" stroke="none">J/kg°C = J ÷ (kg × °C)</text><text x="200" y="178" text-anchor="middle" font-size="19" font-weight="700" fill="#0a1326" stroke="none">Δθ = θ highest − θ start</text><text x="200" y="206" text-anchor="middle" font-size="17" font-weight="400" fill="#0a1326" stroke="none">m in kg (not g)</text></svg>
