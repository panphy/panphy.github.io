<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" width="400" height="270" role="img" font-family="Arial, Helvetica, sans-serif" fill="none" stroke="#0a1326" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><title>The equation for the volume of a cuboid, with a block labelled length, width and height</title><rect width="400" height="270" fill="#ffffff" stroke="none"/><rect x="35" y="22" width="330" height="86" fill="#f3fafc" stroke="#0b7fa3" stroke-width="3" rx="12"/><text x="200" y="62" text-anchor="middle" font-size="27" font-weight="700" fill="#0a1326" stroke="none">V = l × w × h</text><text x="200" y="90" text-anchor="middle" font-size="17" font-weight="400" fill="#0a1326" stroke="none">volume (cm³) = length × width × height</text><path d="M130 150 L170 122 L290 122 L250 150 Z" stroke="#e6edf0" stroke-width="#0a1326" fill="2.8"/><path d="M250 150 L290 122 L290 178 L250 206 Z" stroke="#aebbc1" stroke-width="#0a1326" fill="2.8"/><rect x="130" y="150" width="120" height="56" fill="#c9d3d8" stroke="#0a1326" stroke-width="2.8"/><text x="190" y="232" text-anchor="middle" font-size="17" font-weight="700" fill="#d0182b" stroke="none">l</text><text x="112" y="184" text-anchor="middle" font-size="17" font-weight="700" fill="#d0182b" stroke="none">h</text><text x="280" y="148" text-anchor="middle" font-size="17" font-weight="700" fill="#d0182b" stroke="none">w</text></svg>
