<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" width="400" height="270" role="img" font-family="Arial, Helvetica, sans-serif" fill="none" stroke="#0a1326" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><title>The wave speed equation v equals f times lambda</title><rect width="400" height="270" fill="#ffffff" stroke="none"/><rect x="30" y="46" width="340" height="116" fill="#f3fafc" stroke="#0b7fa3" stroke-width="3" rx="12"/><text x="200" y="86" text-anchor="middle" font-size="27" font-weight="700" fill="#0a1326" stroke="none">v = f × λ</text><text x="200" y="114" text-anchor="middle" font-size="17" font-weight="400" fill="#0a1326" stroke="none">wave speed = frequency × wavelength</text><text x="200" y="142" text-anchor="middle" font-size="17" font-weight="400" fill="#0a1326" stroke="none">m/s = Hz × m</text><text x="200" y="214" text-anchor="middle" font-size="17" font-weight="400" fill="#0a1326" stroke="none">use f from step 5 and λ from step 4</text></svg>
