<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" width="400" height="270" role="img" font-family="Arial, Helvetica, sans-serif" fill="none" stroke="#0a1326" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><title>The bung is pushed into the opening of the Leslie cube and a stopwatch counts one minute so that every face reaches the same temperature</title><rect width="400" height="270" fill="#ffffff" stroke="none"/><line x1="10" y1="232" x2="390" y2="232" stroke="#0a1326" stroke-width="4"/><path d="M150 130 L184 106.2 L274 106.2 L240 130 Z" fill="#e6edf0" stroke="#0a1326" stroke-width="2.8"/><path d="M240 130 L274 106.2 L274 208.2 L240 232 Z" fill="#aebbc1" stroke="#0a1326" stroke-width="2.8"/><rect x="150" y="130" width="90" height="102" fill="#dfe6e9" stroke="#0a1326" stroke-width="2.8"/><path d="M199 118 V103 A13 4.5 0 0 1 225 103 V118 A13 4.5 0 0 1 199 118 Z" fill="#c9d3d8" stroke="#0a1326" stroke-width="2.6"/><path d="M198 91 L201 104 A11 3.8 0 0 0 223 104 L226 91 Z" fill="#c98f5c" stroke="#0b7fa3" stroke-width="2.6"/><ellipse cx="212" cy="91" rx="14" ry="4.6" fill="#ddb089" stroke="#0b7fa3" stroke-width="2.6"/><text x="112" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#0b7fa3" stroke="none">bung</text><line x1="136" y1="88" x2="194" y2="94" stroke="#0b7fa3" stroke-width="2.2"/><rect x="334" y="52" width="8" height="8" fill="#c9d3d8" stroke="#0a1326" stroke-width="2"/><circle cx="338" cy="90" r="30" fill="#ffffff" stroke="#0a1326" stroke-width="3"/><text x="338" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#0a1326" stroke="none">1:00</text><text x="338" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1326" stroke="none">wait</text><text x="338" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1326" stroke="none">1 minute</text><text x="200" y="256" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1326" stroke="none">all four sides 