<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" width="400" height="270" role="img" font-family="Arial, Helvetica, sans-serif" fill="none" stroke="#0a1326" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><title>The lid is on the Leslie cube and a stopwatch counts one minute so that every face reaches the same temperature</title><rect width="400" height="270" fill="#ffffff" stroke="none"/><line x1="10" y1="232" x2="390" y2="232" stroke="#0a1326" stroke-width="4"/><path d="M150 130 L184 106.2 L274 106.2 L240 130 Z" stroke="#e6edf0" stroke-width="#0a1326" fill="2.8"/><path d="M240 130 L274 106.2 L274 208.2 L240 232 Z" stroke="#aebbc1" stroke-width="#0a1326" fill="2.8"/><rect x="150" y="130" width="90" height="102" fill="#dfe6e9" stroke="#0a1326" stroke-width="2.8"/><rect x="145" y="120" width="100" height="10" fill="#b9c4c9" stroke="#0a1326" stroke-width="2.6" rx="2"/><path d="M235 120 l34 -24 l-16 0 l-34 24" stroke="#b9c4c9" stroke-width="#0a1326" fill="2"/><rect x="334" y="52" width="8" height="8" fill="#c9d3d8" stroke="#0a1326" stroke-width="2"/><circle cx="338" cy="90" r="30" fill="#ffffff" stroke="#0a1326" stroke-width="3"/><text x="338" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#0a1326" stroke="none">1:00</text><text x="338" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1326" stroke="none">wait</text><text x="338" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1326" stroke="none">1 minute</text><text x="110" y="74" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1326" stroke="none">all four sides reach</text><text x="110" y="94" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1326" stroke="none">the same temperature</text></svg>
