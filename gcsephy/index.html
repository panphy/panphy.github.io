<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>GCSE Physics - PanPhy Labs</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #0f0f12;
      color: #e8e4dc;
      font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace;
      padding: 48px 24px;
      max-width: 760px;
    }

    a.back {
      display: inline-block;
      color: rgba(232, 228, 220, 0.42);
      text-decoration: none;
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      margin-bottom: 40px;
    }

    a.back:hover {
      color: #e8e4dc;
    }

    h1 {
      font-size: 1rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(232, 228, 220, 0.38);
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.76rem;
      color: rgba(232, 228, 220, 0.28);
      letter-spacing: 0.06em;
      margin-bottom: 34px;
    }

    h2 {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(232, 228, 220, 0.3);
      margin: 28px 0 10px;
    }

    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    a.entry {
      display: flex;
      align-items: baseline;
      gap: 18px;
      padding: 13px 16px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      text-decoration: none;
      color: inherit;
      transition: background 0.12s ease, border-color 0.12s ease;
    }

    a.entry:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .entry-name {
      font-size: 0.92rem;
      color: #e8e4dc;
      flex-shrink: 0;
    }

    .entry-desc {
      font-size: 0.78rem;
      color: rgba(232, 228, 220, 0.42);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 620px) {
      body {
        padding: 36px 18px;
      }

      a.entry {
        flex-direction: column;
        gap: 5px;
      }

      .entry-desc {
        white-space: normal;
      }
    }
  </style>
  <script src="/gcsephy/sw-register.js" defer></script>
</head>

<body>
  <a class="back" href="/">&larr; PanPhy Labs</a>
  <h1>GCSE Physics</h1>
  <p class="subtitle">Unit companions for AQA GCSE physics</p>

  <h2>Year 9</h2>
  <ul>
    <li>
      <a class="entry" href="year9phy/unit01/">
        <span class="entry-name">Work Like a Physicist</span>
        <span class="entry-desc">Unit 1 companion · working scientifically, missions and Exam Zone</span>
      </a>
    </li>
  </ul>

  <h2>Year 10</h2>
  <ul>
    <li>
      <a class="entry" href="year10phy/unit01/">
        <span class="entry-name">Electric Circuits</span>
        <span class="entry-desc">Electricity companion · revision notes, practice and Exam Zone</span>
      </a>
    </li>
  </ul>

  <!-- Add an entry whenever a page, unit or standalone resource is added under gcsephy/. -->
  <!-- Remove or update the entry when a page is renamed or deleted. -->
</body>

</html>
