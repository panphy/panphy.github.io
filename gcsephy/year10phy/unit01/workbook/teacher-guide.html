<head>

  <title>Electric Circuits - Year 10 Teacher Guide</title>
  <link rel="stylesheet" href="assets/diagrams-print.css">

  <style>
    .guide .compare td, .guide .compare th { font-size: 9pt; }
    .guide .plan-time td:first-child { width: 14mm; white-space: nowrap; }
    .guide .plan-time td:nth-child(2) { width: 32mm; }
    .guide .online { background: #f6f7f9; grid-template-columns: 1fr; }
    .guide .online p { font-size: 9pt; line-height: 1.35; }

    .guide .compare td, .guide .compare th { padding: 1.2mm 2mm; font-size: 8.6pt; line-height: 1.3; }
    .guide .sub { margin: 2.6mm 0 1.4mm; font-size: 9.4pt; }
    .guide .key { margin: 1.5mm 0 2mm; padding: 2mm 3mm 2mm 10mm; font-size: 9pt; }
    .guide .goals li { font-size: 8.8pt; }
    .guide .homework { margin: 2mm 0; padding: 2mm 3mm; border-left: 4px solid var(--cyan); background: var(--cyan-t); font-size: 9pt; }
    .guide .route td { padding: .7mm 2mm; font-size: 8pt; }
    .guide .route td:first-child { font-size: 9pt; }
    .guide section:first-child li { font-size: 8.8pt; margin-bottom: .6mm; }
