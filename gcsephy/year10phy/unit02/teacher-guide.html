<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Particle Model of Matter - Year 10 Teacher Guide</title>
  <link rel="stylesheet" href="assets/workbook.css">
  <link rel="stylesheet" href="assets/figures.css">
  <style>
    .guide { font-size: 9pt; line-height: 1.33; }
    .guide section:first-child { break-before: auto; }
    .guide > section { zoom: .93; }
    .guide section:first-child li { font-size: 8.4pt; margin-bottom: .4mm; }
    .guide .plan-time td:first-child { width: 14mm; white-space: nowrap; }
    .guide .plan-time td:nth-child(2) { width: 32mm; }
    .guide .online { background: #f6f7f9; grid-template-columns: 1fr; }
    .guide .online p { font-size: 9pt; line-height: 1.35; }
    .guide .opener { padding: 4mm 5mm; grid-template-columns: 22mm 1fr; }
    .guide .opener .num { font-size: 34pt; }
    .guide .opener h2 { font-size: 16pt; }
    .guide .big-q { margin-top: 2.5mm; padding: 2mm 3mm; font-size: 9.4pt; }
    .guide .compare td, .guide .compare th { padding: 1mm 2mm; font-size: 8.3pt; line-height: 1.27; }
    .guide .sub { margin: 2.6mm 0 1.4mm; font-size: 9.4pt; }
    .guide .key { margin: 1.5mm 0 2mm; padding: 2mm 3mm 2mm 10mm; font-size: 9pt; }
    .guide .goals li { font-size: 8.8pt; }
    .guide .homework { margin: 2mm 0; padding: 2mm 3mm; border-left: 4px solid var(--cyan); background: var(--cyan-t); font-size: 9pt; }
    .guide .route td { padding: .7mm 2mm; font-size: 8pt; }
    .guide .route td:first-child { font-size: 9pt; }
    .guide .tag { display: inline-block; margin-left: 2mm; padding: 0 1.5mm; border: 1px solid var(--ink); font-size: 7pt; font-weight: 700; }
  </style>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <script>
    window.MathJax = { tex: { inlineMath: [['\\(', '\\)']] }, svg: { fontCache: 'none' }, startup: { typeset: false }, options: { enableMenu: false } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <script src="assets/figures.js"></script>
  <script src="assets/lessons-1-4.js"></script>
  <script src="assets/lessons-5-8.js"></script>
  <script src="assets/reference.js"></script>
  <script src="assets/plans-data.js"></script>
  <script src="/gcsephy/sw-register.js" defer></script>
</head>
<body>
  <script src="assets/plans.js"></script>
</body>
</html>
