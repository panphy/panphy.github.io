<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" width="400" height="270" role="img" font-family="Arial, Helvetica, sans-serif" fill="none" stroke="#0a1326" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><title>The equation for energy supplied, E equals P times t</title><rect width="400" height="270" fill="#ffffff" stroke="none"/><rect x="35" y="60" width="330" height="86" fill="#f3fafc" stroke="#0b7fa3" stroke-width="3" rx="12"/><text x="200" y="100" text-anchor="middle" font-size="27" font-weight="700" fill="#0a1326" stroke="none">E = P × t</text><text x="200" y="128" text-anchor="middle" font-size="17" font-weight="400" fill="#0a1326" stroke="none">energy (J) = power (W) × time (s)</text><text x="200" y="190" text-anchor="middle" font-size="17" font-weight="400" fill="#0a1326" stroke="none">time in seconds:</text><text x="200" y="218" text-anchor="middle" font-size="19" font-weight="700" fill="#0a1326" stroke="none">10 minutes = 600 s</text></svg>
