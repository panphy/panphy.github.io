<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" width="400" height="270" role="img" font-family="Arial, Helvetica, sans-serif" fill="none" stroke="#0a1326" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><title>The equation for density, rho equals m divided by V</title><rect width="400" height="270" fill="#ffffff" stroke="none"/><rect x="35" y="56" width="330" height="86" fill="#f3fafc" stroke="#0b7fa3" stroke-width="3" rx="12"/><text x="200" y="96" text-anchor="middle" font-size="27" font-weight="700" fill="#0a1326" stroke="none">ρ = m ÷ V</text><text x="200" y="124" text-anchor="middle" font-size="17" font-weight="400" fill="#0a1326" stroke="none">density (g/cm³) = mass (g) ÷ volume (cm³)</text><text x="200" y="190" text-anchor="middle" font-size="17" font-weight="400" fill="#0a1326" stroke="none">m = mass of liquid,  V = volume of liquid</text></svg>
