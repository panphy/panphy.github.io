<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" width="400" height="270" role="img" font-family="Arial, Helvetica, sans-serif" fill="none" stroke="#0a1326" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><title>The equation R equals V divided by I for the total resistance</title><rect width="400" height="270" fill="#ffffff" stroke="none"/><rect x="35" y="64" width="330" height="86" fill="#f3fafc" stroke="#0b7fa3" stroke-width="3" rx="12"/><text x="200" y="104" text-anchor="middle" font-size="27" font-weight="700" fill="#0a1326" stroke="none">R = V ÷ I</text><text x="200" y="132" text-anchor="middle" font-size="17" font-weight="400" fill="#0a1326" stroke="none">potential difference (V) ÷ current (A)</text><text x="200" y="190" text-anchor="middle" font-size="17" font-weight="400" fill="#0a1326" stroke="none">R = total resistance of the two resistors</text></svg>
