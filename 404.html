<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found - PanPhy Labs</title>
  <script>
    // Forward addresses of pages that have moved. Anything else shows the page below.
    (function () {
      var MOVED = [
        ['/misc/gcsephy/', '/gcsephy/'],
        ['/misc/year10phy/', '/gcsephy/year10phy/']
      ];
      var path = location.pathname;
      for (var i = 0; i < MOVED.length; i += 1) {
        if (path.indexOf(MOVED[i][0]) === 0) {
          location.replace(MOVED[i][1] + path.slice(MOVED[i][0].length) + location.search + location.hash);
          return;
        }
      }
    })();
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background: #0f0f12;
      color: #e8e4dc;
      font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace;
      text-align: center;
    }

    h1 {
      font-size: 1rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(232, 228, 220, 0.5);
      margin: 0 0 12px;
    }

    p {
      font-size: 0.85rem;
      color: rgba(232, 228, 220, 0.42);
      margin: 0 0 28px;
    }

    a {
      display: inline-block;
      padding: 13px 18px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #e8e4dc;
      text-decoration: none;
    }

    a:hover {
      background: rgba(255, 255, 255, 0.07);
    }
  </style>
</head>

<body>
  <main>
    <h1>Page not found</h1>
    <p>This page does not exist or has moved.</p>
    <a href="/">&larr; PanPhy Labs</a>
  </main>
</body>

</html>
