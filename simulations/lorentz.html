  <script src="/assets/fullscreen-button.js"></script>
</head>

<body>
    <header class="banner">
        <div class="banner-logo">
            <a href="https://panphy.app/">
                <img src="/assets/panphy.png" alt="PanPhy logo">
            </a>
        </div>
        <div class="banner-title">Lorentz Transformation</div>
        <div class="banner-actions">
            <a href="/simulations/lorentz_learn.html" class="banner-button" title="Learn the physics">Learn</a>
            <div class="theme-toggle">
                <button id="theme-button" data-panphy-theme-toggle aria-label="Toggle Light/Dark Theme" title="Toggle between light and dark themes">&#9728;&#65039;</button>
            </div>
            <button data-panphy-fullscreen aria-label="Enter fullscreen" title="Enter fullscreen"></button>
        </div>
    </header>

    <div class="main-content">
        <div id="mainContainer">
            <div id="diagramContainer">
                <canvas id="minkowskiCanvas" width="800" height="600"></canvas>
                <div class="canvas-controls">
                    <div class="section-header">Controls</div>
                    <div class="controls-grid">
                        <label class="toggle-row">
                            <span class="toggle-label">Frame S Axes</span>
                            <input type="checkbox" class="toggle-input" id="restAxesToggle" checked>
                            <span class="toggle-switch"></span>
                        </label>
                        <label class="toggle-row">
                            <span class="toggle-label">Frame S Grid</span>
                            <input type="checkbox" class="toggle-input" id="gridToggle" checked>
                            <span class="toggle-switch"></span>
                        </label>
                        <label class="toggle-row">
                            <span class="toggle-label">Events</span>
                            <input type="checkbox" class="toggle-input" id="eventsToggle" checked>
                            <span class="toggle-switch"></span>
                        </label>
                        <label class="toggle-row">
                            <span class="toggle-label">Frame S′ Axes</span>
                            <input type="checkbox" class="toggle-input" id="movingAxesToggle" checked>
                            <span class="toggle-switch"></span>
                        </label>
                        <label class="toggle-row">
                            <span class="toggle-label">Frame S′ Grid</span>
                            <input type="checkbox" class="toggle-input" id="movingGridToggle">
                            <span class="toggle-switch"></span>
                        </label>
                        <label class="toggle-row">
                            <span class="toggle-label">Projection Lines</span>
                            <input type="checkbox" class="toggle-input" id="projectionsToggle" checked>
                            <span class="toggle-switch"></span>
                        </label>
                    </div>
                </div>
            </div>

            <div id="controlsContainer">
                <!-- Diagram frame -->
                <div class="control-section">
                    <div class="section-header">Draw the Diagram in</div>
                    <div class="segmented" role="group" aria-label="Frame the diagram is drawn in">
                        <button type="button" id="viewSBtn" aria-pressed="true">Frame S</button>
                        <button type="button" id="viewSpBtn" aria-pressed="false">Frame S′</button>
                    </div>
                </div>

                <!-- Velocity -->
                <div class="control-section">
                    <div class="section-header">Velocity</div>
                    <div class="controlItem">
                        <div class="controlInline velocity-header-row">
                            <label class="controlLabel" for="speedSlider">Velocity of S′ relative to S, <strong>v</strong></label>
                            <button id="alignFramesBtn" class="inline-action-btn">Set v = 0</button>
                        </div>
                        <input type="range" id="speedSlider" min="-0.95" max="0.95" step="0.01" value="0">
                        <div class="value-row">
                            <div class="stepper">
                                <button type="button" id="speedMinus" aria-label="Decrease v by 0.01c">−</button>
                                <input type="number" id="speedInput" min="-0.95" max="0.95" step="0.01" value="0.00" aria-label="Velocity v as a fraction of c">
                                <button type="button" id="speedPlus" aria-label="Increase v by 0.01c">+</button>
                                <span class="unit">c</span>
                            </div>
                            <output id="gammaValue" class="readout">γ = 1.000</output>
                        </div>
                    </div>
                </div>

                <!-- Velocity Transformation -->
                <div class="control-section velocity-transform-section">
                    <div class="section-header">Velocity Transformation</div>
                    <label class="toggle-row">
                        <span class="toggle-label">Show Object's Worldline</span>
                        <input type="checkbox" class="toggle-input" id="velocityToggle">
                        <span class="toggle-switch"></span>
                    </label>
                    <div class="controlItem">
                        <label class="controlLabel" for="velocitySlider">Object's Velocity in S, <strong>u</strong></label>
                        <input type="range" id="velocitySlider" min="-0.95" max="0.95" step="0.01" value="0.30">
                        <div class="value-row">
                            <div class="stepper">
                                <button type="button" id="velocityMinus" aria-label="Decrease u by 0.01c">−</button>
                                <input type="number" id="velocityInput" min="-0.95" max="0.95" step="0.01" value="0.30" aria-label="Object's velocity u in frame S as a fraction of c">
                                <button type="button" id="velocityPlus" aria-label="Increase u by 0.01c">+</button>
                                <span class="unit">c</span>
                            </div>
                            <output id="uPrimeValue" class="readout">u′ = 0.30c</output>
                        </div>
                    </div>
                </div>

                <!-- Tools -->
                <div class="control-section">
                    <div class="section-header">Tools</div>
                    <div class="button-row">
                        <button id="addEventBtn">Add Event</button>
                        <button id="removeAllEventsBtn">Clear Events</button>
                    </div>
                </div>

                <!-- Coordinates -->
                <div id="coordinates"></div>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 <a href="/">PanPhy Labs</a>. All rights reserved. |
        <a href="https://buymeacoffee.com/panphy" target="_blank" rel="noopener noreferrer">Support My Projects</a>
    </footer>

    <div id="contextMenu">
        <div class="context-menu-item" id="contextRemoveEvent">Remove Event</div>
    </div>

    <script>
        // Theme Toggle
        window.PanPhyThemeToggle.mount(document.getElementById('theme-button'));

        // Offline font fallback
        function updateOfflineFontState() {
            document.documentElement.classList.toggle('offline-font', !navigator.onLine);
        }
        window.addEventListener('online', updateOfflineFontState);
        window.addEventListener('offline', updateOfflineFontState);
        updateOfflineFontState();

        // Helper to get CSS variable colors
        function getCssVar(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        // Canvas labels use the page fonts: the body face for names, the mono face for tick values.
        const CANVAS_FONT = getCssVar('--font-body') || 'Figtree, system-ui, sans-serif';
        const CANVAS_MONO = getCssVar('--font-mono') || '"IBM Plex Mono", monospace';

        window.addEventListener("load", function () {
            const canvas = document.getElementById("minkowskiCanvas");
            const ctx = canvas.getContext("2d");

            const speedSlider = document.getElementById("speedSlider");
            const speedInput = document.getElementById("speedInput");
            const gammaValue = document.getElementById("gammaValue");
            const velocitySlider = document.getElementById("velocitySlider");
            const velocityInput = document.getElementById("velocityInput");
            const uPrimeValue = document.getElementById("uPrimeValue");

            const restAxesToggle = document.getElementById("restAxesToggle");
            const gridToggle = document.getElementById("gridToggle");
            const eventsToggle = document.getElementById("eventsToggle");
            const movingAxesToggle = document.getElementById("movingAxesToggle");
            const movingGridToggle = document.getElementById("movingGridToggle");
            const projectionsToggle = document.getElementById("projectionsToggle");
            const velocityToggle = document.getElementById("velocityToggle");
            const viewButtons = {
                S: document.getElementById("viewSBtn"),
                Sp: document.getElementById("viewSpBtn")
            };

            const addEventBtn = document.getElementById("addEventBtn");
            const removeAllEventsBtn = document.getElementById("removeAllEventsBtn");
            const alignFramesBtn = document.getElementById("alignFramesBtn");

            const diagramContainer = document.getElementById("diagramContainer");
            const controlsContainer = document.getElementById("controlsContainer");
            const coordinatesDiv = document.getElementById("coordinates");
            const contextMenu = document.getElementById("contextMenu");
            const contextRemoveEvent = document.getElementById("contextRemoveEvent");

            let selectedEvent = null;
            let draggingEvent = null;
            let contextEvent = null;
            let longPressTimeout = null;

            let didDrag = false;
            let mouseDownPos = { x: 0, y: 0 };
            const DRAG_THRESHOLD = 5;
            let draggingCanvas = false;
            let canvasDragStart = { x: 0, y: 0 };
            let originStart = { x: 0, y: 0 };

            let origin = { x: canvas.width * 0.5, y: canvas.height * 0.9 };
            const scale = 80;
            const PAN_EDGE_MARGIN_UNITS = 0.5;
            const PAN_EDGE_MARGIN_PX = PAN_EDGE_MARGIN_UNITS * scale;
            const FRAME_ALIGNMENT_EPSILON = 1e-6;
            const SPEED_LIMIT = 0.95;
            const COORD_LIMIT = 99;
            const COORDINATES_MIN_HEIGHT = 220;

            const EVENT_RADIUS = 7;
            const MOUSE_HIT_RADIUS = EVENT_RADIUS + 6;
            const TOUCH_HIT_RADIUS = EVENT_RADIUS + 25;
            const TOUCH_SELECT_RADIUS = 50;

            const SNAP_THRESHOLD = 0.1; // snap when within 0.1 units of an integer

            // The diagram is drawn in a display frame moving at tanh(viewRapidity)
            // relative to S: 0 for the S view, v for the S′ view, in between while
            // the view switch animates. Events and u are always stored in S.
            const VIEW_ANIMATION_MS = 600;
            const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
            const coarsePointer = window.matchMedia("(pointer: coarse)");
            let viewFrame = "S";
            let viewRapidity = 0;
            let viewAnimation = null;
            let viewAnimationFrame = null;

            function snapToGrid(value) {
                const rounded = Math.round(value);
                return Math.abs(value - rounded) < SNAP_THRESHOLD ? rounded : value;
            }

            function clientToCanvas(clientX, clientY) {
                const r = canvas.getBoundingClientRect();
                return {
                    x: (clientX - r.left) * (canvas.width / r.width),
                    y: (clientY - r.top) * (canvas.height / r.height)
                };
            }

            let events = [];
            let nextEventLabelCode = "A".charCodeAt(0);
            let availableLabels = [];

            function getSpeed() {
                return parseFloat(speedSlider.value);
            }

            function getObjectVelocity() {
                return parseFloat(velocitySlider.value);
            }

            function gammaOf(w) {
                return 1 / Math.sqrt(1 - w * w);
            }

            // Coordinates of an event in a frame moving at w relative to the frame of pt
            function boost(pt, w) {
                const gamma = gammaOf(w);
                return {
                    x: gamma * (pt.x - w * pt.t),
                    t: gamma * (pt.t - w * pt.x)
                };
            }

            // Velocity u (measured in S) as measured in a frame moving at w relative to S
            function velocityInFrame(u, w) {
                return (u - w) / (1 - u * w);
            }

            function viewVelocity() {
                return Math.tanh(viewRapidity);
            }

            function toDisplay(pt) {
                return boost(pt, viewVelocity());
            }

            function fromDisplay(pt) {
                return boost(pt, -viewVelocity());
            }

            function isAligned(w) {
                return Math.abs(w) < FRAME_ALIGNMENT_EPSILON;
            }

            function syncControlPanelHeight() {
                if (window.matchMedia("(max-width: 900px)").matches) {
                    controlsContainer.style.removeProperty("height");
                    return;
                }

                const leftPanelHeight = Math.round(diagramContainer.getBoundingClientRect().height);
                // Keep room for the coordinates table header and a few rows
                const tableTop = coordinatesDiv.getBoundingClientRect().top - controlsContainer.getBoundingClientRect().top;
                const neededHeight = Math.ceil(tableTop + COORDINATES_MIN_HEIGHT);
                if (leftPanelHeight > 0) {
                    controlsContainer.style.height = `${Math.max(leftPanelHeight, neededHeight)}px`;
                }
            }

            function getNextLabel() {
                if (availableLabels.length > 0) {
                    availableLabels.sort();
                    return availableLabels.shift();
                } else {
                    let label = String.fromCharCode(nextEventLabelCode);
                    nextEventLabelCode++;
                    return label;
                }
            }

            events.push({ label: getNextLabel(), x: 1, t: 2 });

            function toCanvasCoords(x, t) {
                return {
                    x: origin.x + x * scale,
                    y: origin.y - t * scale
                };
            }
            function toMinkowskiCoords(cx, cy) {
                return {
                    x: (cx - origin.x) / scale,
                    t: (origin.y - cy) / scale
                };
            }

            function clampToRange(value, min, max) {
                if (min > max) return (min + max) * 0.5;
                return Math.min(max, Math.max(min, value));
            }

            function clampOriginToViewport(nextOrigin) {
                const minOriginX = PAN_EDGE_MARGIN_PX;
                const maxOriginX = canvas.width - PAN_EDGE_MARGIN_PX;
                const minOriginY = PAN_EDGE_MARGIN_PX;
                const maxOriginY = canvas.height - PAN_EDGE_MARGIN_PX;

                return {
                    x: clampToRange(nextOrigin.x, minOriginX, maxOriginX),
                    y: clampToRange(nextOrigin.y, minOriginY, maxOriginY)
                };
            }

            origin = clampOriginToViewport(origin);

            function getBoundingBox() {
                return {
                    xMin: (0 - origin.x) / scale,
                    xMax: (canvas.width - origin.x) / scale,
                    tMin: (origin.y - canvas.height) / scale,
                    tMax: (origin.y - 0) / scale
                };
            }

            // Clip the line through p with direction d (display coordinates) to the view
            function clipLine(p, d) {
                const { xMin, xMax, tMin, tMax } = getBoundingBox();
                let sMin = -Infinity;
                let sMax = Infinity;
                for (const [pc, dc, lo, hi] of [[p.x, d.x, xMin, xMax], [p.t, d.t, tMin, tMax]]) {
                    if (Math.abs(dc) < 1e-12) {
                        if (pc < lo || pc > hi) return null;
                        continue;
                    }
                    let a = (lo - pc) / dc;
                    let b = (hi - pc) / dc;
                    if (a > b) [a, b] = [b, a];
                    sMin = Math.max(sMin, a);
                    sMax = Math.min(sMax, b);
                }
                if (sMin > sMax) return null;
                return [
                    { x: p.x + sMin * d.x, t: p.t + sMin * d.t },
                    { x: p.x + sMax * d.x, t: p.t + sMax * d.t }
                ];
            }

            function strokeLine(p, d) {
                const segment = clipLine(p, d);
                if (!segment) return null;
                const a = toCanvasCoords(segment[0].x, segment[0].t);
                const b = toCanvasCoords(segment[1].x, segment[1].t);
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.stroke();
                return segment;
            }

            // Range of whole-number coordinate values of a frame (moving at w relative
            // to the display) that cross the visible box
            function frameCoordinateRange(w, axis) {
                const { xMin, xMax, tMin, tMax } = getBoundingBox();
                const values = [[xMin, tMin], [xMin, tMax], [xMax, tMin], [xMax, tMax]].map(([x, t]) => {
                    const p = boost({ x, t }, w);
                    return axis === "x" ? p.x : p.t;
                });
                return [Math.ceil(Math.min(...values)), Math.floor(Math.max(...values))];
            }

            function drawFrameGrid(w, color, dash) {
                const gamma = gammaOf(w);
                ctx.strokeStyle = color;
                ctx.lineWidth = 1;
                ctx.setLineDash(dash);

                // Lines of constant x_F = n, then of constant t_F = n
                const [xLo, xHi] = frameCoordinateRange(w, "x");
                for (let n = xLo; n <= xHi; n++) {
                    strokeLine({ x: n / gamma, t: 0 }, { x: w, t: 1 });
                }
                const [tLo, tHi] = frameCoordinateRange(w, "t");
                for (let n = tLo; n <= tHi; n++) {
                    strokeLine({ x: 0, t: n / gamma }, { x: 1, t: w });
                }

                ctx.setLineDash([]);
            }

            function drawFrameAxes(frame) {
                const { w, axisColor, lineWidth, names, labelShift } = frame;
                ctx.strokeStyle = axisColor;
                ctx.lineWidth = lineWidth;
                const tSegment = strokeLine({ x: 0, t: 0 }, { x: w, t: 1 });
                const xSegment = strokeLine({ x: 0, t: 0 }, { x: 1, t: w });

                ctx.fillStyle = axisColor;
                ctx.font = `16px ${CANVAS_FONT}`;
                ctx.textAlign = "start";
                ctx.textBaseline = "alphabetic";
                if (tSegment) {
                    const end = tSegment[0].t > tSegment[1].t ? tSegment[0] : tSegment[1];
                    const c = toCanvasCoords(end.x, end.t);
                    ctx.fillText(names.t, c.x + 10 + labelShift, c.y + 20);
                }
                if (xSegment) {
                    const end = xSegment[0].x > xSegment[1].x ? xSegment[0] : xSegment[1];
                    const c = toCanvasCoords(end.x, end.t);
                    ctx.fillText(names.x, c.x - 20, c.y - 10 - labelShift);
                }
            }

            function drawFrameTicks(frame) {
                const { w, tickColor, tickFont, tickMarks } = frame;
                const gamma = gammaOf(w);
                const { xMin, xMax, tMin, tMax } = getBoundingBox();
                const axisAngle = Math.atan(w);
                const tickLen = 5;
                const inView = p => p.x >= xMin - 0.5 && p.x <= xMax + 0.5 && p.t >= tMin - 0.5 && p.t <= tMax + 0.5;

                ctx.fillStyle = tickColor;
                ctx.strokeStyle = tickColor;
                ctx.font = tickFont;
                ctx.lineWidth = 1.5;

                for (let n = -40; n <= 40; n++) {
                    if (n === 0) continue;

                    // t_F axis tick (x_F = 0, t_F = n)
                    const tTick = { x: w * n * gamma, t: n * gamma };
                    if (inView(tTick)) {
                        const cp = toCanvasCoords(tTick.x, tTick.t);
                        ctx.save();
                        ctx.translate(cp.x, cp.y);
                        ctx.rotate(-axisAngle);
                        if (tickMarks) {
                            ctx.beginPath();
                            ctx.moveTo(-tickLen, 0);
                            ctx.lineTo(tickLen, 0);
                            ctx.stroke();
                        }
                        ctx.textAlign = "right";
                        ctx.textBaseline = "middle";
                        ctx.fillText(n, -tickLen - 3, 0);
                        ctx.restore();
                    }

                    // x_F axis tick (t_F = 0, x_F = n)
                    const xTick = { x: n * gamma, t: w * n * gamma };
                    if (inView(xTick)) {
                        const cp = toCanvasCoords(xTick.x, xTick.t);
                        ctx.save();
                        ctx.translate(cp.x, cp.y);
                        ctx.rotate(-axisAngle);
                        if (tickMarks) {
                            ctx.beginPath();
                            ctx.moveTo(0, -tickLen);
                            ctx.lineTo(0, tickLen);
                            ctx.stroke();
                        }
                        ctx.textAlign = "center";
                        ctx.textBaseline = "top";
                        ctx.fillText(n, 0, tickLen + 2);
                        ctx.restore();
                    }
                }

                ctx.textAlign = "start";
                ctx.textBaseline = "alphabetic";
            }

            function drawRoundedRect(x, y, width, height, radius) {
                const r = Math.min(radius, width / 2, height / 2);
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + width - r, y);
                ctx.arcTo(x + width, y, x + width, y + r, r);
                ctx.lineTo(x + width, y + height - r);
                ctx.arcTo(x + width, y + height, x + width - r, y + height, r);
                ctx.lineTo(x + r, y + height);
                ctx.arcTo(x, y + height, x, y + height - r, r);
                ctx.lineTo(x, y + r);
                ctx.arcTo(x, y, x + r, y, r);
                ctx.closePath();
            }

            function parseRgbColor(colorValue) {
                const value = colorValue.trim();
                const hexMatch = value.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
                if (hexMatch) {
                    let hex = hexMatch[1];
                    if (hex.length === 3) {
                        hex = hex.split("").map(ch => ch + ch).join("");
                    }
                    return {
                        r: parseInt(hex.slice(0, 2), 16),
                        g: parseInt(hex.slice(2, 4), 16),
                        b: parseInt(hex.slice(4, 6), 16)
                    };
                }
                const rgbMatch = value.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
                if (rgbMatch) {
                    return {
                        r: parseInt(rgbMatch[1], 10),
                        g: parseInt(rgbMatch[2], 10),
                        b: parseInt(rgbMatch[3], 10)
                    };
                }
                return null;
            }

            function getReadableTextColor(backgroundColor) {
                const rgb = parseRgbColor(backgroundColor);
                if (!rgb) return "#ffffff";
                const luminance = (0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b) / 255;
                return luminance > 0.62 ? "#111827" : "#ffffff";
            }

            function drawPillLabel({ text, x, y, background, textColor = null, align = "center", baseline = "middle" }) {
                const font = `bold 12px ${CANVAS_FONT}`;
                const padX = 8;
                const padY = 4;
                const margin = 4;
                const isDarkTheme = document.documentElement.getAttribute("data-theme") === "dark";
                const resolvedTextColor = textColor || (isDarkTheme ? "#000000" : getReadableTextColor(background));

                ctx.save();
                ctx.font = font;
                const textMetrics = ctx.measureText(text);
                const textWidth = textMetrics.width;
                const measuredHeight = (textMetrics.actualBoundingBoxAscent || 0) + (textMetrics.actualBoundingBoxDescent || 0);
                const textHeight = measuredHeight > 0 ? measuredHeight : 12;
                const pillWidth = textWidth + padX * 2;
                const pillHeight = textHeight + padY * 2;

                let left = x;
                if (align === "center") left -= pillWidth / 2;
                if (align === "right") left -= pillWidth;

                let top = y;
                if (baseline === "middle") top -= pillHeight / 2;
                if (baseline === "bottom" || baseline === "alphabetic") top -= pillHeight;

                left = Math.max(margin, Math.min(canvas.width - pillWidth - margin, left));
                top = Math.max(margin, Math.min(canvas.height - pillHeight - margin, top));

                drawRoundedRect(left, top, pillWidth, pillHeight, pillHeight / 2);
                ctx.fillStyle = background;
                ctx.fill();

                ctx.fillStyle = resolvedTextColor;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(text, left + pillWidth / 2, top + pillHeight / 2 + 0.5);
                ctx.restore();
            }

            function drawWorldline(u) {
                const uDisplay = velocityInFrame(u, viewVelocity());
                const color = getCssVar('--velocity-line-u');
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                const segment = strokeLine({ x: 0, t: 0 }, { x: uDisplay, t: 1 });
                if (!segment) return;

                const [low, high] = segment[0].t < segment[1].t ? segment : [segment[1], segment[0]];
                const s = 0.7;
                const labelPoint = toCanvasCoords(low.x + s * (high.x - low.x), low.t + s * (high.t - low.t));
                const uPrime = velocityInFrame(u, getSpeed());
                drawPillLabel({
                    text: `u = ${u.toFixed(2)}c  ·  u′ = ${uPrime.toFixed(2)}c`,
                    x: labelPoint.x + 12,
                    y: labelPoint.y,
                    background: color,
                    align: "left",
                    baseline: "middle"
                });
            }

            // Guide lines from the selected event to the axes of one frame, drawn
            // parallel to that frame's other axis
            function drawFrameProjections(evtDisplay, frame, pills) {
                const { w, projectionColor, names, coords, xPillAbove } = frame;
                const cp = toCanvasCoords(evtDisplay.x, evtDisplay.t);
                const k = 1 - w * w;

                // Along (w, 1) to the x_F axis, t = w x
                const s1 = (w * evtDisplay.x - evtDisplay.t) / k;
                const hitX = toCanvasCoords(evtDisplay.x + w * s1, evtDisplay.t + s1);
                // Along (1, w) to the t_F axis, x = w t
                const s2 = (w * evtDisplay.t - evtDisplay.x) / k;
                const hitT = toCanvasCoords(evtDisplay.x + s2, evtDisplay.t + w * s2);

                ctx.strokeStyle = projectionColor;
                ctx.lineWidth = 1.5;
                ctx.setLineDash([6, 4]);
                for (const hit of [hitX, hitT]) {
                    ctx.beginPath();
                    ctx.moveTo(cp.x, cp.y);
                    ctx.lineTo(hit.x, hit.y);
                    ctx.stroke();
                }
                ctx.setLineDash([]);

                // Put each pill on the side of its axis away from the event
                let above = xPillAbove;
                if (above && cp.y < hitX.y) above = false;
                if (!above && cp.y > hitX.y) above = true;
                const tPillRight = cp.x < hitT.x;
                pills.push({
                    text: `${names.x}=${coords.x.toFixed(2)}`,
                    x: hitX.x,
                    y: above ? hitX.y - 14 : hitX.y + 16,
                    background: projectionColor,
                    align: "center",
                    baseline: above ? "bottom" : "middle"
                });
                pills.push({
                    text: `${names.t}=${coords.t.toFixed(2)}`,
                    x: tPillRight ? hitT.x + 14 : hitT.x - 14,
                    y: hitT.y,
                    background: projectionColor,
                    align: tPillRight ? "left" : "right",
                    baseline: "middle"
                });
            }

            function drawLightCone() {
                ctx.strokeStyle = getCssVar('--light-cone');
                ctx.lineWidth = 1;
                ctx.setLineDash([5, 5]);
                strokeLine({ x: 0, t: 0 }, { x: 1, t: 1 });
                strokeLine({ x: 0, t: 0 }, { x: 1, t: -1 });
                ctx.setLineDash([]);
            }

            function drawEvent(p) {
                const d = toDisplay(p);
                const cp = toCanvasCoords(d.x, d.t);

                if (p === selectedEvent) {
                    ctx.strokeStyle = getCssVar('--event');
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(cp.x, cp.y, EVENT_RADIUS + 5, 0, 2 * Math.PI);
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.arc(cp.x, cp.y, EVENT_RADIUS, 0, 2 * Math.PI);
                ctx.fillStyle = getCssVar('--event');
                ctx.fill();
                ctx.strokeStyle = getCssVar('--canvas-bg');
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = getCssVar('--axis-rest');
                ctx.font = `bold 14px ${CANVAS_FONT}`;
                ctx.textAlign = "start";
                ctx.textBaseline = "alphabetic";
                ctx.fillText(p.label, cp.x + EVENT_RADIUS + 6, cp.y - EVENT_RADIUS - 4);
            }

            function updateViewRapidity(now) {
                const target = viewFrame === "Sp" ? Math.atanh(getSpeed()) : 0;
                if (!viewAnimation) {
                    viewRapidity = target;
                    return;
                }
                const progress = Math.min(1, (now - viewAnimation.start) / VIEW_ANIMATION_MS);
                const eased = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
                viewRapidity = viewAnimation.from + (target - viewAnimation.from) * eased;
                if (progress >= 1) {
                    viewAnimation = null;
                    viewRapidity = target;
                }
            }

            function animateView() {
                draw();
                viewAnimationFrame = viewAnimation ? requestAnimationFrame(animateView) : null;
            }

            function setViewFrame(frame) {
                if (frame === viewFrame) return;
                viewFrame = frame;
                Object.entries(viewButtons).forEach(([key, button]) => {
                    button.setAttribute("aria-pressed", String(key === frame));
                });
                if (reducedMotion.matches) {
                    viewAnimation = null;
                    draw();
                    return;
                }
                viewAnimation = { from: viewRapidity, start: performance.now() };
                if (viewAnimationFrame === null) {
                    viewAnimationFrame = requestAnimationFrame(animateView);
                }
            }

            window.addEventListener('panphy:theme-change', () => draw());
            // Redraw once the page fonts have loaded, so canvas labels use them.
            if (document.fonts) document.fonts.ready.then(() => draw());

            function draw() {
                updateViewRapidity(performance.now());

                const v = getSpeed();
                const u = getObjectVelocity();
                const displayV = viewVelocity();
                gammaValue.textContent = `γ = ${gammaOf(v).toFixed(3)}`;
                uPrimeValue.textContent = `u′ = ${velocityInFrame(u, v).toFixed(2)}c`;

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const projectionPills = [];
                const framesAligned = isAligned(v);

                // Both frames, described by their velocity relative to the display frame
                const restFrame = {
                    key: "S",
                    w: velocityInFrame(0, displayV),
                    axisColor: getCssVar('--axis-rest'),
                    lineWidth: 2,
                    gridColor: getCssVar('--grid-rest'),
                    gridDash: [5, 5],
                    tickColor: getCssVar('--text-secondary'),
                    tickFont: `12px ${CANVAS_MONO}`,
                    tickMarks: false,
                    names: { x: "x", t: "t" },
                    labelShift: 0,
                    projectionColor: getCssVar('--event-rest'),
                    xPillAbove: false,
                    showAxes: restAxesToggle.checked,
                    showGrid: gridToggle.checked
                };
                const movingFrame = {
                    key: "Sp",
                    w: velocityInFrame(v, displayV),
                    axisColor: getCssVar('--axis-moving'),
                    lineWidth: 1.5,
                    gridColor: getCssVar('--grid-moving'),
                    gridDash: [2, 4],
                    tickColor: getCssVar('--axis-moving'),
                    tickFont: `11px ${CANVAS_MONO}`,
                    tickMarks: true,
                    names: { x: "x′", t: "t′" },
                    labelShift: framesAligned ? 16 : 0,
                    projectionColor: getCssVar('--axis-moving'),
                    xPillAbove: true,
                    showAxes: movingAxesToggle.checked,
                    showGrid: movingGridToggle.checked
                };
                // The frame the diagram is drawn in goes on top
                const frames = viewFrame === "S" ? [movingFrame, restFrame] : [restFrame, movingFrame];

                frames.forEach(frame => {
                    if (frame.showGrid) drawFrameGrid(frame.w, frame.gridColor, frame.gridDash);
                });

                frames.forEach(frame => {
                    if (!frame.showAxes) return;
                    drawFrameAxes(frame);
                    // When the frames coincide, only the viewed frame's numbers are drawn
                    if (frame.key === viewFrame || !framesAligned) drawFrameTicks(frame);
                });

                if (velocityToggle.checked) {
                    drawWorldline(u);
                }

                drawLightCone();

                if (eventsToggle.checked && projectionsToggle.checked && selectedEvent && events.includes(selectedEvent)) {
                    const evtDisplay = toDisplay(selectedEvent);
                    restFrame.coords = selectedEvent;
                    movingFrame.coords = boost(selectedEvent, v);
                    frames.forEach(frame => {
                        if (!frame.showAxes) return;
                        if (frame.key !== viewFrame && framesAligned) return;
                        drawFrameProjections(evtDisplay, frame, projectionPills);
                    });
                }

                if (eventsToggle.checked) {
                    events.forEach(drawEvent);
                }

                projectionPills.forEach(drawPillLabel);

                // Projection lines need a selected, visible event: say so when there is none
                const projectionHint = !projectionsToggle.checked || !events.length ? null
                    : !eventsToggle.checked ? "Turn on Events to see projection lines"
                    : !events.includes(selectedEvent) ? `${coarsePointer.matches ? "Tap" : "Click"} an event to see its projection lines`
                    : null;
                if (projectionHint) {
                    drawPillLabel({
                        text: projectionHint,
                        x: 12,
                        y: 12,
                        background: getCssVar('--table-header-bg'),
                        textColor: getCssVar('--text-main'),
                        align: "left",
                        baseline: "top"
                    });
                }

                updateEventTable();
            }

            // Make draw globally accessible for theme toggle
            window.draw = draw;

            // ---- Event coordinates table ----

            const COORD_FIELDS = [
                { key: "x", name: "x", frame: "S" },
                { key: "t", name: "t", frame: "S" },
                { key: "xp", name: "x′", frame: "S′" },
                { key: "tp", name: "t′", frame: "S′" }
            ];

            function formatCoord(value) {
                const text = value.toFixed(2);
                return text === "-0.00" ? "0.00" : text;
            }

            function eventCoordValue(p, key) {
                if (key === "x" || key === "t") return p[key];
                const primed = boost(p, getSpeed());
                return key === "xp" ? primed.x : primed.t;
            }

            function renderEventTable() {
                const rows = events.length
                    ? events.map(p => `
                        <tr data-label="${p.label}">
                            <td class="event-label">${p.label}</td>
                            ${COORD_FIELDS.map(f => `<td><input class="coord-input${f.frame === "S′" ? " frame-sp" : ""}" type="number" step="0.1" data-field="${f.key}" aria-label="${f.name} of event ${p.label} in frame ${f.frame}"></td>`).join("")}
                        </tr>`).join("")
                    : `<tr><td colspan="5" class="empty-row">No events. Use Add Event.</td></tr>`;

                coordinatesDiv.innerHTML = `
                    <h3>Event Coordinates</h3>
                    <div class="coordinates-table-scroll">
                        <table>
                            <thead>
                                <tr>
                                    <th rowspan="2">Event</th>
                                    <th colspan="2">Frame S</th>
                                    <th colspan="2" class="frame-sp">Frame S′</th>
                                </tr>
                                <tr>
                                    <th>x</th>
                                    <th>t</th>
                                    <th class="frame-sp">x′</th>
                                    <th class="frame-sp">t′</th>
                                </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                    ${events.length ? `<p class="table-hint">Type a coordinate to move an event exactly.</p>` : ""}
                `;
                updateEventTable();
            }

            function updateEventTable() {
                coordinatesDiv.querySelectorAll("tr[data-label]").forEach(row => {
                    const p = events.find(e => e.label === row.dataset.label);
                    if (!p) return;
                    row.classList.toggle("selected", p === selectedEvent);
                    row.querySelectorAll(".coord-input").forEach(input => {
                        if (input === document.activeElement) return;
                        input.value = formatCoord(eventCoordValue(p, input.dataset.field));
                    });
                });
            }

            function eventForInput(input) {
                const row = input.closest("tr[data-label]");
                return row ? events.find(e => e.label === row.dataset.label) : null;
            }

            function setEventCoord(p, key, value) {
                value = Math.max(-COORD_LIMIT, Math.min(COORD_LIMIT, value));
                if (key === "x" || key === "t") {
                    p[key] = value;
                    return;
                }
                const v = getSpeed();
                const primed = boost(p, v);
                primed[key === "xp" ? "x" : "t"] = value;
                const rest = boost(primed, -v);
                p.x = rest.x;
                p.t = rest.t;
            }

            coordinatesDiv.addEventListener("input", e => {
                const input = e.target.closest(".coord-input");
                if (!input) return;
                const p = eventForInput(input);
                const value = parseFloat(input.value);
                if (!p || !Number.isFinite(value)) return;
                setEventCoord(p, input.dataset.field, value);
                draw();
            });

            coordinatesDiv.addEventListener("change", e => {
                const input = e.target.closest(".coord-input");
                const p = input && eventForInput(input);
                if (!p) return;
                input.value = formatCoord(eventCoordValue(p, input.dataset.field));
            });

            coordinatesDiv.addEventListener("focusin", e => {
                const input = e.target.closest(".coord-input");
                const p = input && eventForInput(input);
                if (!p || p === selectedEvent) return;
                selectedEvent = p;
                draw();
            });

            // ---- Canvas interaction (in display coordinates) ----

            function findEventAt(cx, cy, radius) {
                if (!eventsToggle.checked) return null;
                for (let i = events.length - 1; i >= 0; i--) {
                    const d = toDisplay(events[i]);
                    const cp = toCanvasCoords(d.x, d.t);
                    if (Math.hypot(cx - cp.x, cy - cp.y) < radius) return events[i];
                }
                return null;
            }

            function moveEventToCanvasPoint(p, cx, cy) {
                const display = toMinkowskiCoords(cx, cy);
                // Snap to whole numbers of the frame the diagram is drawn in
                const rest = fromDisplay({ x: snapToGrid(display.x), t: snapToGrid(display.t) });
                p.x = rest.x;
                p.t = rest.t;
            }

            canvas.addEventListener("mousedown", e => {
                if (e.button !== 0) return;
                didDrag = false;
                const { x: mx, y: my } = clientToCanvas(e.clientX, e.clientY);
                mouseDownPos.x = mx;
                mouseDownPos.y = my;

                draggingEvent = findEventAt(mx, my, MOUSE_HIT_RADIUS);
                if (!draggingEvent) {
                    draggingCanvas = true;
                    canvasDragStart.x = mx;
                    canvasDragStart.y = my;
                    originStart.x = origin.x;
                    originStart.y = origin.y;
                }
            });

            canvas.addEventListener("mousemove", e => {
                const { x: mx, y: my } = clientToCanvas(e.clientX, e.clientY);

                if (!didDrag) {
                    const dx = mx - mouseDownPos.x, dy = my - mouseDownPos.y;
                    if (dx * dx + dy * dy < DRAG_THRESHOLD * DRAG_THRESHOLD) return;
                    didDrag = true;
                }

                if (draggingEvent) {
                    moveEventToCanvasPoint(draggingEvent, mx, my);
                    draw();
                } else if (draggingCanvas) {
                    const nextOrigin = {
                        x: originStart.x + (mx - canvasDragStart.x),
                        y: originStart.y + (my - canvasDragStart.y)
                    };
                    origin = clampOriginToViewport(nextOrigin);
                    draw();
                }
            });

            canvas.addEventListener("mouseup", e => {
                if (!didDrag) {
                    if (draggingEvent) {
                        selectedEvent = (selectedEvent === draggingEvent) ? null : draggingEvent;
                    } else {
                        selectedEvent = null;
                    }
                    draw();
                }
                draggingEvent = null;
                draggingCanvas = false;
            });

            canvas.addEventListener("mouseleave", () => {
                draggingEvent = null;
                draggingCanvas = false;
            });

            canvas.addEventListener("touchstart", e => {
                e.preventDefault();
                didDrag = false;
                const touch = e.touches[0];
                const { x: tx, y: ty } = clientToCanvas(touch.clientX, touch.clientY);
                mouseDownPos.x = tx;
                mouseDownPos.y = ty;

                draggingEvent = findEventAt(tx, ty, TOUCH_HIT_RADIUS);
                if (draggingEvent) {
                    const p = draggingEvent;
                    longPressTimeout = setTimeout(() => {
                        contextEvent = p;
                        showContextMenu(touch.pageX, touch.pageY);
                    }, 800);
                } else {
                    draggingCanvas = true;
                    canvasDragStart.x = tx;
                    canvasDragStart.y = ty;
                    originStart.x = origin.x;
                    originStart.y = origin.y;
                }
            });

            canvas.addEventListener("touchmove", e => {
                e.preventDefault();
                const touch = e.touches[0];
                const { x: tx, y: ty } = clientToCanvas(touch.clientX, touch.clientY);

                if (!didDrag) {
                    const dx = tx - mouseDownPos.x, dy = ty - mouseDownPos.y;
                    if (dx * dx + dy * dy < DRAG_THRESHOLD * DRAG_THRESHOLD) return;
                    didDrag = true;
                }

                if (longPressTimeout) {
                    clearTimeout(longPressTimeout);
                    longPressTimeout = null;
                }

                if (draggingEvent) {
                    moveEventToCanvasPoint(draggingEvent, tx, ty);
                    draw();
                } else if (draggingCanvas) {
                    const nextOrigin = {
                        x: originStart.x + (tx - canvasDragStart.x),
                        y: originStart.y + (ty - canvasDragStart.y)
                    };
                    origin = clampOriginToViewport(nextOrigin);
                    draw();
                }
            });

            canvas.addEventListener("touchend", () => {
                if (longPressTimeout) clearTimeout(longPressTimeout);

                if (!didDrag) {
                    if (draggingEvent) {
                        selectedEvent = (selectedEvent === draggingEvent) ? null : draggingEvent;
                    } else {
                        // Tap-to-select: nearest event within threshold
                        const nearest = findEventAt(mouseDownPos.x, mouseDownPos.y, TOUCH_SELECT_RADIUS);
                        selectedEvent = (nearest && selectedEvent !== nearest) ? nearest : null;
                    }
                    draw();
                }
                draggingEvent = null;
                draggingCanvas = false;
            });

            canvas.addEventListener("touchcancel", () => {
                if (longPressTimeout) clearTimeout(longPressTimeout);
                draggingEvent = null;
                draggingCanvas = false;
            });

            function showContextMenu(pageX, pageY) {
                contextMenu.style.display = "block";
                contextMenu.style.left = pageX + "px";
                contextMenu.style.top = pageY + "px";
            }

            canvas.addEventListener("contextmenu", e => {
                e.preventDefault();
                const { x: mx, y: my } = clientToCanvas(e.clientX, e.clientY);
                const p = findEventAt(mx, my, MOUSE_HIT_RADIUS);
                if (p) {
                    contextEvent = p;
                    showContextMenu(e.pageX, e.pageY);
                    return;
                }
                contextMenu.style.display = "none";
            });

            contextRemoveEvent.addEventListener("click", () => {
                if (contextEvent) {
                    if (selectedEvent === contextEvent) selectedEvent = null;
                    const idx = events.indexOf(contextEvent);
                    if (idx !== -1) {
                        availableLabels.push(contextEvent.label);
                        events.splice(idx, 1);
                    }
                    contextEvent = null;
                    contextMenu.style.display = "none";
                    renderEventTable();
                    draw();
                }
            });

            document.addEventListener("click", e => {
                if (!contextMenu.contains(e.target)) {
                    contextMenu.style.display = "none";
                }
            });

            document.addEventListener("touchstart", e => {
                if (!contextMenu.contains(e.target)) {
                    contextMenu.style.display = "none";
                }
            });

            // Random point in the visible part of the future light cone, in display
            // coordinates (the light cone is the same in every frame)
            function getRandomVisibleFutureConeEvent() {
                const { xMin, xMax, tMin, tMax } = getBoundingBox();
                const EVENT_VIEW_PADDING = 0.15;
                const MIN_EVENT_T = 0.1;

                const visibleXMin = xMin + EVENT_VIEW_PADDING;
                const visibleXMax = xMax - EVENT_VIEW_PADDING;
                const visibleTMin = tMin + EVENT_VIEW_PADDING;
                const visibleTMax = tMax - EVENT_VIEW_PADDING;

                if (visibleXMin > visibleXMax || visibleTMin > visibleTMax) {
                    return null;
                }

                const minAllowedT = Math.max(
                    MIN_EVENT_T,
                    visibleTMin,
                    visibleXMin,
                    -visibleXMax
                );
                const maxAllowedT = visibleTMax;

                if (minAllowedT > maxAllowedT) {
                    return null;
                }

                const newT = minAllowedT + Math.random() * (maxAllowedT - minAllowedT);
                const minAllowedX = Math.max(visibleXMin, -newT);
                const maxAllowedX = Math.min(visibleXMax, newT);

                if (minAllowedX > maxAllowedX) {
                    return null;
                }

                const newX = minAllowedX + Math.random() * (maxAllowedX - minAllowedX);
                return { x: newX, t: newT };
            }

            addEventBtn.addEventListener("click", () => {
                if (events.length >= 15) {
                    console.log("Maximum number of events reached.");
                    return;
                }

                const displayCoords = getRandomVisibleFutureConeEvent();
                if (!displayCoords) {
                    alert("Current view does not intersect the future light cone. Pan the diagram and try again.");
                    return;
                }

                const rest = fromDisplay(displayCoords);
                events.push({
                    label: getNextLabel(),
                    x: rest.x,
                    t: rest.t
                });

                renderEventTable();
                draw();
            });

            removeAllEventsBtn.addEventListener("click", () => {
                events.forEach(p => availableLabels.push(p.label));
                events = [];
                selectedEvent = null;
                renderEventTable();
                draw();
            });

            // ---- Velocity inputs: slider, stepper and typed value kept in step ----

            function roundSpeed(value) {
                const rounded = Math.round(Math.max(-SPEED_LIMIT, Math.min(SPEED_LIMIT, value)) * 100) / 100;
                return rounded === 0 ? 0 : rounded;
            }

            function bindStepper(minus, plus, change) {
                for (const [button, direction] of [[minus, -1], [plus, 1]]) {
                    let delay = null;
                    let timer = null;
                    const stop = () => {
                        clearTimeout(delay);
                        clearInterval(timer);
                        delay = timer = null;
                    };
                    button.addEventListener("pointerdown", event => {
                        event.preventDefault();
                        change(direction);
                        stop();
                        delay = setTimeout(() => { timer = setInterval(() => change(direction), 90); }, 420);
                    });
                    for (const type of ["pointerup", "pointerleave", "pointercancel", "blur"]) button.addEventListener(type, stop);
                    // Keyboard activation arrives as a click with no pointer
                    button.addEventListener("click", event => { if (event.detail === 0) change(direction); });
                }
            }

            function bindSpeedControl(slider, input, minus, plus) {
                const set = value => {
                    const rounded = roundSpeed(value);
                    slider.value = rounded;
                    input.value = rounded.toFixed(2);
                    draw();
                };
                slider.addEventListener("input", () => {
                    input.value = parseFloat(slider.value).toFixed(2);
                    draw();
                });
                input.addEventListener("input", () => {
                    const value = parseFloat(input.value);
                    if (!Number.isFinite(value) || Math.abs(value) > SPEED_LIMIT) return;
                    slider.value = roundSpeed(value);
                    draw();
                });
                input.addEventListener("change", () => {
                    const value = parseFloat(input.value);
                    set(Number.isFinite(value) ? value : parseFloat(slider.value));
                });
                bindStepper(minus, plus, direction => set(parseFloat(slider.value) + direction * 0.01));
                input.value = parseFloat(slider.value).toFixed(2);
                return set;
            }

            const setSpeed = bindSpeedControl(speedSlider, speedInput,
                document.getElementById("speedMinus"), document.getElementById("speedPlus"));
            bindSpeedControl(velocitySlider, velocityInput,
                document.getElementById("velocityMinus"), document.getElementById("velocityPlus"));

            alignFramesBtn.addEventListener("click", () => setSpeed(0));

            viewButtons.S.addEventListener("click", () => setViewFrame("S"));
            viewButtons.Sp.addEventListener("click", () => setViewFrame("Sp"));

            [restAxesToggle, gridToggle, eventsToggle, movingAxesToggle, movingGridToggle,
                projectionsToggle, velocityToggle].forEach(toggle => toggle.addEventListener("change", draw));
            // Turning projection lines on shows them straight away, on the first event
            projectionsToggle.addEventListener("change", () => {
                if (projectionsToggle.checked && events.length && !events.includes(selectedEvent)) {
                    selectedEvent = events[0];
                    draw();
                }
            });
            window.addEventListener("resize", syncControlPanelHeight);

            renderEventTable();
            syncControlPanelHeight();
            draw();
        });
    </script>
    <script>
        // Gradient text: skip on Brave iOS where background-clip:text is broken
        (function() {
            if (/iP(hone|ad|od)/.test(navigator.userAgent) && navigator.brave) return;
            document.querySelectorAll('.banner-title').forEach(function(el) { el.classList.add('gradient-text'); });
        })();
    </script>
</body>

</html>
